        "heading": "Deterministic Cohort Construction"
      },
      "fragment_sha256": "1254a3689344a384a8b3fd66193a8054cab26bce5e128dfc5437abd412a650bb",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Deterministic Cohort Construction\n\nFor two or more ordered sections, partition into contiguous cohorts of two or\nthree. Do not create extra cohorts to fill provider capacity. A one-section\ntitle may use one explicit singleton. If an already approved story/audio\nboundary makes a contiguous 2--3 split impossible, escalate to Founder; do not\ninvent a creative partition.\n\nUse this remainder-first rule, which matches the required examples:\n\n- `n % 3 == 0` -> all threes: 3, 6=3+3, 9=3+3+3;\n- `n % 3 == 1` -> two twos, then threes: 4=2+2, 7=2+2+3, 10=2+2+3+3;\n- `n % 3 == 2` -> one two, then threes: 2, 5=2+3, 8=2+3+3, 11=2+3+3+3.\n\nEvery section belongs to exactly one cohort. Read adjacent cohort boundary\nhandles; never write them.\n\n",
      "selection_reason": "Each P3-Ci receives only its cohort construction, Major motion, composition, and Draft Keyframe review mode."
    },
    {
      "binding_id": "planning_p3_section_kinetic_mode",
      "binding_kind": "linked_read",
      "path": "skills/idol-planning-cdd/references/section-kinetic-architecture.md",
      "revision": "2",
      "whole_file_sha256": "c847d8a5a6c3d025beb41789e37db91a20e05407cd4fdf288c8e2bf6ae2a579e",
      "locator": {
        "type": "markdown_heading",
        "heading": "Own"
      },
      "fragment_sha256": "04dbafd1ec8ed46a46d3040cf2630c0da1ef432ab55c0fb561884170937bf29b",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Own\n\n- section screen jobs and whole-video progression for this cohort;\n- Major event, exact-five one-second Sequence Unit, one-or-two Core marks, and\n  later Branch coverage requirements;\n- still camera height, distance, direction, angle, depth, crop, and composition;\n- action/pose variation, motion readiness, transitions, and continuity handles;\n- evidence-based 2--3 second kinetic change tendency and intentional long holds;\n- Draft Keyframe Proof requirements before final 02B, reusing existing\n  `fp_hero_core` as the noncanonical packet mode.\n\nDo not create one event per section, one Core per time interval, or start/middle/\nend Core dumps. A third Core requires a new governing event and therefore a new\nMajor. Sequence is the parent evidence; Core marks only the stills that must\nremain.\n\n",
      "selection_reason": "Each P3-Ci receives only its cohort construction, Major motion, composition, and Draft Keyframe review mode."
    },
    {
      "binding_id": "planning_p3_section_kinetic_mode",
      "binding_kind": "linked_read",
      "path": "skills/idol-planning-cdd/references/section-kinetic-architecture.md",
      "revision": "2",
      "whole_file_sha256": "c847d8a5a6c3d025beb41789e37db91a20e05407cd4fdf288c8e2bf6ae2a579e",
      "locator": {
        "type": "markdown_heading",
        "heading": "Major Motion Evidence"
      },
      "fragment_sha256": "455d3c2fda33bf3bc2f78ec4e9c0fc71816942b55f5c1e0c73d063ad567b1655",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Major Motion Evidence\n\nEvery material Major requires real contiguous motion evidence: one exact-five\none-second Sequence Unit or linked Units of the same event. A broad contact\nsheet counts as zero. If the Founder chooses a locked hold, still inspect the\ncontiguous interval and state why the hold is stronger than movement. Promotion\neligibility requires motion grade 4 and still-camera/composition grade 4, each\nwith an actual evidence locator. The 2--3 second tendency is a creative pacing\ntarget, not a machine counter.\n\n",
      "selection_reason": "Each P3-Ci receives only its cohort construction, Major motion, composition, and Draft Keyframe review mode."
    },
    {
      "binding_id": "planning_p3_section_kinetic_mode",
      "binding_kind": "linked_read",
      "path": "skills/idol-planning-cdd/references/section-kinetic-architecture.md",
      "revision": "2",
      "whole_file_sha256": "c847d8a5a6c3d025beb41789e37db91a20e05407cd4fdf288c8e2bf6ae2a579e",
      "locator": {
        "type": "markdown_heading",
        "heading": "Review"
      },
      "fragment_sha256": "b445b4f9a260754d31c02d68c229840b7c67c139b122cb0089bc298d472bae6e",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Review\n\nCheck that story and audio produce observable state changes, distinct Major/Core\njobs, varied pose/action, varied still geometry, useful motion landing, and\nnon-flat transitions. Longer holds need song/story evidence; repeated frontal\nmedium, default push, or orbit needs a clear function.\n\nUse P2's selected reference Decision Set as evidence. Do not reopen source\neligibility or author a replacement visual regime. Grade applicable\nstoryline/audio/kinetic/camera/coverage/non-duplication/feasibility criteria on\nthe 0--4 scale. All applicable items must be at least 3, and both motion and\nstill-camera/composition must be 4, before the Decision Set is eligible for P1\nintegration and Overall review.\n\nReturn section topology, Major/Sequence/Core pointers, boundary handles, motion-\nreadiness holds, Draft Keyframe Proof requirements, and the visible consequence\nof every material choice only to P1 through `planning_cdd_p1_exact_link`. P1\nexact-links the reviewed P3-Ci Decision Set and alone returns the integrated\nPlanning Cell milestone to Overall. At G-40, bind the exact\n`section_cohort_id` so the matching production CDD can carry it through 02B\npixel and 03V playback review without silently repartitioning sections.\n",
      "selection_reason": "Each P3-Ci receives only its cohort construction, Major motion, composition, and Draft Keyframe review mode."
    },
    {
      "binding_id": "provider_neutral_studio_kernel",
      "binding_kind": "linked_read",
      "path": "skills/idol-orchestrator/references/provider-neutral-studio-kernel.md",
      "revision": "17",
      "whole_file_sha256": "7e7eadf58b7f99af1e967699f7eb27cd13f7b9e536270dc4403145f6bf6b25ed",
      "locator": {
        "type": "markdown_heading",
        "heading": "Purpose"
      },
      "fragment_sha256": "7bb648554090c53d570f08049fc12cb21454a8d76417e4444a96561685acb63b",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Purpose\n\nThis is the shared Studio Kernel for Cursor, Grok, or another registered\nprovider surface. Provider adapters transport the same per-assignment role\nbinding and launch command; they do not rewrite its creative or studio\nauthority. No global provider mode or model selection establishes authority.\n\nOne launch has three layers:\n\n1. **Registered Department Recipe** — the repeatable job method already written\n   in the exact owning `SKILL.md`, its linked reads, and the selected\n   `automation/harness-skill-load-profiles.yaml` profile/checkpoint. Reference\n   discovery, source eligibility, comparison floors, image-prompt translation,\n   generation inspection, output shape, review route, and ordinary HOLD rules\n   belong here and are reused rather than rewritten for every assignment.\n2. **Director-authored Current Assignment Delta** — what this exact run,\n   section, source set, and checkpoint must solve now. The assigning director\n   writes this only after reading the current frontier and bound evidence. It\n   names the present gap, the decisions the worker may make, the task-specific\n   work that the registered recipe does not already say, and the current-work\n   proof required for review.\n3. **Mechanical Dispatch Envelope** — ids, roles, scope, paths, hashes,\n   permissions, selected profile/checkpoint, output ownership, return route,\n   and wake/stop conditions. A tool may exact-copy these values, add the fixed\n   headings below, and hash the final bytes. It may not choose the Department\n   Recipe, write the Current Assignment Delta, summarize current evidence, or\n   claim creative approval.\n\nThe launch command is therefore reusable without becoming a generic creative\nprompt. Stable work stays stable; current creative judgment stays current.\n\n",
      "selection_reason": "Every role receives the shared authority, command, progression, and review kernel without the non-executable duplicate authoring skeleton."
    },
    {
      "binding_id": "provider_neutral_studio_kernel",
      "binding_kind": "linked_read",
      "path": "skills/idol-orchestrator/references/provider-neutral-studio-kernel.md",
      "revision": "17",
      "whole_file_sha256": "7e7eadf58b7f99af1e967699f7eb27cd13f7b9e536270dc4403145f6bf6b25ed",
      "locator": {
        "type": "markdown_heading",
        "heading": "Who Authors And Who Reads"
      },
      "fragment_sha256": "432c487c29acb3be474493a879a9b4bda31c97b1e1eadee31b958515aaa44a62",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Who Authors And Who Reads\n\n- The Overall Director authors the Current Assignment Delta for CDD startup and\n  any worker it directly owns.\n- The Creative Development Director authors it for Song, reference, identity,\n  and pre-02A development workers.\n- The Edit Director authors it for edit shards.\n- The receiving role's first runtime action is to open the native Goal from\n  `launch.goal_contract` and record its provider-native identity. The mechanical\n  coordinator then verifies the complete selected source closure to EOF and\n  builds the exact `idol-role-context-pack.v1`; the receiver applies that pack,\n  the rendered Current Assignment Delta, and the named current creative sources\n  before work. The pack replaces broad receiver instruction rereads and is not\n  an additional layer. If that runtime cannot\n  open an auditable Goal, return `goal_surface_unavailable` HOLD before work.\n- A valid current-run v3 Founder-feedback sidecar may contribute only the\n  pack's exact role/profile/stage/section-matching compact quality patterns:\n  short reason, recurrence count, bounded positive/avoid/action/review signals,\n  applicability, evidence-rollup digest, and source sidecar pointer. Directors\n  receive the current-run review view; workers receive exact matching section\n  rows. Never load the raw Founder wording or full closure into the runtime\n  command. This advisory semantic edge is not a lock, gate, PASS, or promotion.\n- A provider/model name is transport metadata only. Canonical command prose\n  uses `overall_director`, `creative_development_director`, `department_worker`,\n  `section_owner`, `edit_director`, or `edit_shard_worker` authority. Each\n  attempt binds exactly one `studio_role` and `assignment_key` to owner,\n  parent lineage/session, exact scope, adapter/runtime surface, capability\n  receipt, Goal contract, output owner, return recipient, and stop/wake route.\n- The shared contract covers logical operation, not provider-tool identity.\n  Director/worker roles, physical sharding, Goal admission, successor/CAS/rollback,\n  return, and review are equal across Cursor and Grok. Provider-native tools,\n  auth lanes, event shapes, and capability inventories remain separately\n  registered: Cursor supplies exact text-model sessions while Grok image work\n  uses `image_gen`/`image_edit`. An omitted image provider resolves only to the\n  exact current Grok Section owner's native surface; Cursor Luna image and APIs\n  require explicit Founder\n  selection. A missing capability returns HOLD and never borrows another\n  provider's tool, auth, model, or session.\n- A bounded department worker uses an internal subagent by default. It opens a\n  separate Founder-visible physical assignment session only when the exact\n  run-route row sets `founder_visible: true`: a separate Cursor CLI chat or a\n  separate Grok native/CLI-style session surfaced like a terminal. Both\n  topologies use the same Dispatch, Goal, model/effort, authority, review, and\n  quality contract; visibility grants no promotion authority and neither\n  topology may mix with the parent Director session. CDD dispatch, review, and\n  ordinary FP/02A multi-leaf work must open Grok `spawn_subagent` helpers to\n  the floor in `automation/harness-execution-contract.yaml`\n  `session_route.department_worker_execution_topology.parent_scoped_helpers`.\n  Those helpers are not physical terminals. Image section owners stay physical\n  post-02A sessions.\n- For Cursor CLI transport, create and hash the external assignment Goal record\n  before launch, verify the authenticated account model catalog and exact CLI\n  model argument, then bind the init display, terminal result, request id, and\n  stable session id. Resume must return the same session id.\n- For Grok ACP, invoke `/goal` with the exact objective from\n  `launch.goal_contract` as that first action. The native `goal_updated` event\n  must prove native Goal id, exact objective (or an exact-objective match), and\n  state. The adapter attestation envelope records the raw-event digest, exact\n  goal-text SHA-256, immutable assignment key, attempt/dispatch ids, runtime\n  surface, and timestamp. A model-written id, chat heading, or copied status\n  is not a Goal receipt; a missing or mismatched event plus attestation is\n  `goal_surface_unavailable` HOLD. Other registered adapters require\n  equivalent auditable native Goal evidence and an adapter attestation.\n- Goal state is interpreted through the registered provider adapter. Cursor\n  keeps the host-owned external Goal record active through work. Grok may\n  emit `complete/goal_completed` at the durable terminal of the exact `/goal`\n  admission prompt. In a successor preflight that terminal means only\n  `successor_admission_complete`; the logical CDD assignment remains\n  read-only until the shared session router commits A->B. Neither Goal event\n  is creative PASS, CDD completion, canonical promotion, or Founder PASS.\n\nBefore authoring the Current Assignment Delta, the director must inspect:\n\n1. the exact Founder request and verbatim explicit locks;\n2. the current canonical frontier, decision epoch, owner, and review state;\n3. the selected target/song/audio/whole-video and assigned-section facts needed\n   by this task;\n4. every current source or output whose pixels, playback, or bytes control the\n   assignment;\n5. the selected Department Recipe and its exact checkpoint;\n6. the smallest unresolved decision and the legal next checkpoint.\n\nIf those facts are incomplete, write a bounded HOLD command instead of filling\nthe gap with a generic task.\n\n",
      "selection_reason": "Every role receives the shared authority, command, progression, and review kernel without the non-executable duplicate authoring skeleton."
    },
    {
      "binding_id": "provider_neutral_studio_kernel",
      "binding_kind": "linked_read",
      "path": "skills/idol-orchestrator/references/provider-neutral-studio-kernel.md",
      "revision": "17",
      "whole_file_sha256": "7e7eadf58b7f99af1e967699f7eb27cd13f7b9e536270dc4403145f6bf6b25ed",
      "locator": {
        "type": "markdown_heading",
        "heading": "Fixed Twelve-Block Command"
      },
      "fragment_sha256": "3352f103d2d9bfb6c2c07a6e8acb1eb5d56f234ea2bfcc490184b2c932c8f0b2",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Fixed Twelve-Block Command\n\nEvery rendered launch command uses these exact Markdown H2 headings in this\norder. The headings and repeated transport values may be assembled\nmechanically. The prose marked **current** must be authored by the assigning\ndirector from the inspected current work.\n\n```text\nFirst runtime action: open the registered Goal from launch.goal_contract and\nrecord its provider identity before Role Context Pack validation or creative work; Cursor\ncreates the external Goal record before CLI launch, while Grok ACP captures\n`goal_updated`, with the exact objective hash and assignment-key evidence.\n\n## 01 Dispatch Identity\n## 02 Role And Authority\n## 03 Current Creative Job\n## 04 Exact Scope And Non-Scope\n## 05 Input Pointers\n## 06 Skill Route\n## 07 Required Work\n## 08 Output Contract\n## 09 Quality Proof\n## 10 Return-Ready Conditions\n## 11 HOLD Stop And Split Conditions\n## 12 Return And Wake\n```\n\nBlock ownership is:\n\n| Blocks | Source | Rule |\n|---|---|---|\n| 01, 02, 04, 05, 06, 08, 10, 11, 12 | Mechanical Dispatch Envelope plus registered profile | exact-copy only; task-specific HOLD text may be director-authored |\n| 03 | Current Assignment Delta | director-authored every attempt |\n| 07 | Registered Department Recipe plus Current Assignment Delta | cite/bind the reusable recipe; author only the current extra work, order, or decision gap |\n| 09 | Registered professional gate plus Current Assignment Delta | reuse stable proof categories; author the exact current-work evidence the return must show |\n\nDo not paste the complete owning skill into Blocks 06 or 07. Bind its exact\npath/revision/SHA-256 in the dependency inventory, then bind the validated Role\nContext Pack and its pack/source-set digests. The projector verifies the whole\nsource to EOF; the receiver applies only the exact projected content and named\ncreative sources. Repeating the whole skill creates drift and does not prove\napplication.\n\nThe mechanical envelope carries the immutable role-assignment binding, selected\nprovider adapter and capability receipt, `launch.goal_contract`, and native\nGoal event plus adapter-attestation fields. These values may be exact-copied\nand hashed; no adapter may infer, paraphrase, or replace them. Goal creation\nand its provider-native updated event are runtime compliance receipts, not\ncreative or Founder approval.\n\nThe mechanical envelope also carries a stable `requirement_manifest`. Give\neach Founder instruction, required skill, policy, contract, schema, output,\nquality gate, HOLD rule, and Goal duty its own id, source locator, affected\nscope, expected target, and evidence type. Do not collapse several instructions\ninto one generic “follow everything” row.\n\nCurrent priorities must survive every handoff as executable emphasis, not as a\nbare instruction to read a skill. Exact-project each required Founder row into\nBlock 03, each scoped method/output/HOLD row into Block 07, and each quality or\nAnti-Flat proof row into Block 09, using the stable requirement id and its\nsource locator, affected scope, expected target, and evidence type. The worker\nmust close the same ids in `worker_fulfillment_claims`; the recipient Director\nmust independently close them in `director_review.requirement_results` against\nthe exact returned bytes. Missing, merged-away, genericized, duplicated, or\nself-asserted coverage is a HOLD. Keep the owning skill hash-bound and fully\nverified by the projector, but do not duplicate its whole prose or turn its\ndependency inventory into a second receiver read list.\n\n",
      "selection_reason": "Every role receives the shared authority, command, progression, and review kernel without the non-executable duplicate authoring skeleton."
    },
    {
      "binding_id": "provider_neutral_studio_kernel",
      "binding_kind": "linked_read",
      "path": "skills/idol-orchestrator/references/provider-neutral-studio-kernel.md",
      "revision": "17",
      "whole_file_sha256": "7e7eadf58b7f99af1e967699f7eb27cd13f7b9e536270dc4403145f6bf6b25ed",
      "locator": {
        "type": "markdown_heading",
        "heading": "Same-Session Checkpoint Progression"
      },
      "fragment_sha256": "8f4e8886b11f0814422134a0c0e89253ccc24aa958d6d9648d84cfffe426b87d",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Same-Session Checkpoint Progression\n\nA legal next checkpoint may continue in the same physical session and lineage.\nThis is normal continuation, not a successor-session rollover, only when all of\nthe following are true:\n\n- the current attempt returned and its declared recipient completed director\n  review;\n- any required Founder decision or intervention receipt is recorded and bound;\n- the current owner, scope, and output paths remain unambiguous;\n- the immutable `studio_role` + `assignment_key`, provider adapter/capability\n  receipt, and native Goal/`goal_updated` evidence remain bound to the attempt;\n- the next checkpoint exists in the selected provider-neutral profile and its\n  activation conditions are satisfied;\n- a new immutable attempt is prepared with the next checkpoint's exact\n  skill/read set, refreshed source hashes, and a fresh input digest;\n- no stage, Founder, paid/external, pixel/playback, or owner gate is skipped.\n\nThe director may prepare the next command from that checkpoint without asking\nthe Founder to restate already settled input. It may not infer a PASS, jump to\nan arbitrary later checkpoint, widen scope, or silently replace the owner.\n\nCDD may progress through legal checkpoints inside its one existing physical\nsession. A physical successor is permitted only on the registered Boot Pack v3\nand session-router route: first Founder confirmation, immutable hash-equal\ncheckpoint and no-rollover check, fresh zero-turn read-only successor, exact\nseven-answer preflight, registered Goal-admission receipt, second Founder\nconfirmation, and exact A->B writer compare-and-swap. Embedded Workbench may\nuse its native bridge; direct Cursor-CLI/Grok-CLI operation uses\n`idol-cdd-session-router-state.v1`. Every prompt/resume/dispatch/review/write\nmust be authorized against the current state SHA and generation. A later\nfailure atomically retires B and reactivates A. This changes only physical\nsession authority; it does not rewrite HTML, review-board, canvas, storyline,\nSection, or canonical creative bytes. A provider surface without equivalent\nadmission, CAS, access-denial, and rollback proof remains `HOLD`.\n\n",
      "selection_reason": "Every role receives the shared authority, command, progression, and review kernel without the non-executable duplicate authoring skeleton."
    },
    {
      "binding_id": "provider_neutral_studio_kernel",
      "binding_kind": "linked_read",
      "path": "skills/idol-orchestrator/references/provider-neutral-studio-kernel.md",
      "revision": "17",
      "whole_file_sha256": "7e7eadf58b7f99af1e967699f7eb27cd13f7b9e536270dc4403145f6bf6b25ed",
      "locator": {
        "type": "markdown_heading",
        "heading": "Return Review"
      },
      "fragment_sha256": "1a77025aae9122514a4a599afa8812e8b8f822eecc7cb0c82bb19612caec3695",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Return Review\n\nClose three separate verification layers; none substitutes for another:\n\n1. **Mechanical receipt:** deterministic checks verify fields, cross-fields,\n   paths, hashes, registry and consumer versions, lifecycle order, Goal order,\n   and requirement coverage. They never judge creative adequacy.\n2. **Worker fulfillment claim:** the worker closes every requirement id as\n   `applied`, `held`, or legally `not_applicable`, points to exact output\n   evidence, explains the application, and reports the provider-native Goal identity and return state.\n   A self-claim is evidence for review, not acceptance.\n3. **Director fulfillment review:** after acquiring the single-flight review\n   lease, the recipient Director reviews the validated Role Context Pack, the\n   named current-run creative sources, the same checkpoint closure cards, and\n   the exact returned bytes. The projector already verified the registered\n   source closure to EOF; the Director does not re-read every skill and linked\n   module to EOF as the review method. The Director then records an independent\n   judgment for every requirement id and applies the fixed creative rubric: Goal\n   pursuit, Founder coverage, skill application, schema/contract conformance,\n   current-gap resolution, required outputs, observable specificity,\n   source/pixel grounding, storyline preservation, locks/unaffected truth, and\n   honest completion state. A worker claim, schema/path check, or historical\n   receipt is evidence-only and is not PASS. Overall reviews the curated\n   milestone and whole-film consequence; it does not recount mechanical\n   presence rows.\n\nWorkers may return in parallel and mechanical preflight may run in parallel.\nOne recipient Director must nevertheless review one return at a time in\n`dependency_rank -> returned_at -> dispatch_id` order. Do not open the next\nreturn until the prior disposition, Overall promotion or HOLD, single-writer\ncommit, and baseline refresh are recorded. Overall promotion uses one global\nlease. Batch acceptance and batch promotion are forbidden.\n\nThe exact input/result digest, reviewer role, owning scope, and Founder epoch\nidentify a semantic review. Carry a valid receipt forward when those values are\nunchanged; a new session, provider, or model is not a re-review trigger. Overall\nreviews the recipient Director's curated milestone and whole-work consequence,\nnot the raw worker checklist again, unless bytes, governing input, epoch,\nevidence completeness, owner/scope, or a concrete conflict changed.\n\nBefore a successor attempt, resolve its canonical predecessor in the same run\nand prove terminal runtime return, recipient review, and Overall promoted/HOLD\nclosure. `final` and `hold` may close; `authority_request` and `milestone`\npreserve the same attempt. Keep dispatch records under\n`RUN/work/department-dispatches/` and every output or manifest inside that\nalbum/title/run; never create a global worker lane below `runs/`.\n\nTrack review submissions independently from checkpoint `attempt_number`. One\nreview cycle allows three submissions at most, with the initial return counted\nas 1. On a non-accept disposition, the Director must return the complete\nobserved problem set, exact invalidated outputs, one correction action, and\nexplicit acceptance criteria together. Submission 2 or 3 opens a fresh native\nGoal that exact-copies that correction action and scopes work/output only to the\ninvalidated paths. That Goal reopens the same section-worker line or session\nthat authored those paths; do not reassign the whole package to a new random\nworker. Preserve all other predecessor outputs as hash-frozen inputs;\ndo not regenerate them. Same-session correction preserves session and lineage;\nnew-session correction starts a fresh lineage at attempt one but preserves the\nsame review cycle and next submission number. Submission 3 may pass, but another\nchild retry is forbidden; route a remaining failure upstream or HOLD. Session,\nprovider, model, or Founder epoch cannot reset the counter for the same work\npackage.\n\nDo not spend a creative Goal or review submission on corroborated transport\ndrift. Re-hash all prepared launch bindings before creating a worker session.\nWhen one stale hash field disagrees with at least three current-hash receipts\nacross two independent lifecycle phases, including the latest phase for those\nbytes, route it once to the mechanical coordinator's run-local\n`department-transport-refreshes/` receipt. Preserve the immutable Dispatch,\nall creative bytes, the existing Director review, and the submission number.\nIf the bound source bytes themselves changed and no such consensus exists,\nthe recipient Director performs one impact recheck before deciding whether a\ntargeted creative correction is needed; workers do not bounce the same hash\nproblem between sessions. Changed output bytes never qualify for this shortcut.\n\nWorkers do not create creative grandchildren in either internal or physical\nexecution. A worker that needs a split returns exact unowned subscopes, sibling\ncount, disjoint paths, shared boundaries, and risk. Its recipient Director owns\nreview and any sibling Dispatch creation.\n\nOnly after all three layers pass and both leases close may the normal CDD\nreview, Founder gate, or next same-session checkpoint proceed.\n",
      "selection_reason": "Every role receives the shared authority, command, progression, and review kernel without the non-executable duplicate authoring skeleton."
    },
