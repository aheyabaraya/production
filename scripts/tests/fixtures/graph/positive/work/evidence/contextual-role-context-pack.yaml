    {
      "binding_id": "production_system",
      "binding_kind": "linked_read",
      "path": "wiki/production-system.md",
      "revision": "content-addressed",
      "whole_file_sha256": "05f8b11cc1a26e7e5e6177539605814dc2e2aa693a0285031738318ad626c1aa",
