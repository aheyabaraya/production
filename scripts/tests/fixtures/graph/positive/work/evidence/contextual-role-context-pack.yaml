      "fragment_sha256": "aadc79d79b1173402029f2cee5694024c6d59eaff9644c668d5bbede92a577f6",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "### Contextual Creative Review Authority\n\nStory, directing, planning, camera progression, Core-Cut/Branch-Cut event ownership,\nreference application, repetition, reprise, visual richness, and plausibility\nare contextual creative judgments. A deterministic rule may validate schema,\ntypes, enums, ids, hashes, exact-copy transfer, source coverage, output\nownership, and approval state, but it must not pass, fail, rank, or rewrite\ncreative work from repeated words, camera tuples, prompt hashes, semantic\nsimilarity, reference frequency, section length, or space/action signatures.\n\n",
      "selection_reason": "Runtime roles receive current-source, observable-language, contextual-review, authorship, and asset rules."
