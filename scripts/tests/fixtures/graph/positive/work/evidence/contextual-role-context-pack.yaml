      },
      "fragment_sha256": "3b0c9d3ccc3e923887d9f305866a9434729a4577f1a62c2ce6ee2961b0d69b43",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Active Route\n\nThe Graph v2 branch below is the verified-switch target; legacy-pinned authoring\nremains the active writer until that switch.\n\n```text\nFounder G0 input\n-> one logical Overall Director lineage\n-> PRE-00 audience + trend evidence -> Founder target/promise/message lock\n   -> immutable full natural-language MV storyline original + append-only\n      full-text revisions/reference receipts -> v3 exact-copy handoff\n-> Planning CDD Cell until G-40: P1 Story/Audience, P2 Visual/Reference,\n   P3-C1..Cn Section/Kinetic (one contiguous 2--3-section cohort each)\n   -> one Founder-visible Song Room under the Planning Cell -> selected audio\n      -> audio-motion map -> 00A\n-> whole-work Section Dispatch Map\n   -> only disjoint video/still/Pinterest assignments needed for named gaps\n      (provider-native helpers stay inside the parent Work Package; media/long\n       context/independent outputs may start in a physical session)\n   -> conditional current-title Member Visual Identity room when a card is missing/new/restyled\n   -> disjoint bounded pre-02A development blocks under backpressure\n-> Front Planning + 01R / optional 01R-C\n   -> exactly FP-A/B/C + MJxx Major Stacks + 2--4 Sequence/Core candidates\n   -> exact Core reference coverage + representative/risk Hero proof -> G-30\n   -> Founder G1 planning route\n-> 01 one-image Official Cores -> 02A imported-Core Branch-only plan\n   -> 02A Draft Keyframe Proof + audio hard-cut animatic -> Founder G2 -> G-40\n-> Planning Cell read-only handoff; exact P3 section_cohort_id carried into V-C1..V-Cn\n-> roster-derived Section-Cluster CDDs; partitions 2 or 3 only\n   (4=2+2, 5=2+3, 7=2+2+3, 8=2+3+3, 9=3+3+3; singleton only for one-section titles)\n-> fresh exact-one-section lineage: provider-neutral 02B/Cut image -> G-50\n   -> provider omitted: current Grok session `image_gen`/`image_edit` on the\n      Grok CLI Section owner; Cursor Luna image is explicit-only and opens\n      only when the Founder names it, then transfers through the registered\n      Luna-to-Grok CAS after pixel review; explicit APIs remain separate\n      and never fallback\n   -> same-cohort 03V successor: placement -> Core/Branch Motion Storyboard\n      -> 480/720 playback -> that Section-Cluster CDD\n-> Overall cross-cohort whole-film review\n-> fresh Founder-visible Edit Director -> disjoint Edit shards when needed -> 04 merge/QC\n-> Founder G3 reviewed section playback\n-> mandatory 04FX transition-opportunity audit (may close `complete_no_fx_needed`)\n-> 05 master/release package -> Founder G4\n```\n\nThere is no active 00, 01A, or 02 creative artifact. Build one coherent\nfull-song MV graph first. Every material Major requires real contiguous\nmotion evidence. Active reference roles are at most `character_visual`,\n`scene_visual_package`, `motion_reference`, and optional `prop_reference`.\nRecover a bound unit by `source_id` → locator → function/role → disposition\n(`applied` / `combined` / `held` / `rejected`) → section/Major/Core binding →\n02A Branch / 02B packet / 03V motion storyboard, using `source_id`, locator,\nand SHA-256. Wiki is a routing summary, not a second media library; default\npacks and this page exclude raw URL lists. A Founder-selected coherent teaser may enter physical\nproduction before held full-MV scope, but the two states remain independent and\nreuse the same lineage. Publishing, platform upload, analytics,\nand memory promotion are separate post-05 operations routed to\n`wiki/social-automation-system.md`. Studio dashboard and secretary work\n(Notion, Drive `IDOL_STUDIO`, Grok Bot, Slack) routes to\n`wiki/idol-studio-ops.md` and is never ordinary MV load. CF-code is isolated under `cf/`; read\n`cf/AGENTS.md` before CF work and never load CF detail for an ordinary MV.\nNo Major Scene, Core Cut, 02A, or other mid-pipeline videoization route exists;\nmotion execution remains behind the post-02A image pass and 03V.\n\n",
      "selection_reason": "The pack already carries role and stage ownership; runtime receives only the active route, four-role lineage inside Active Route, Dispatch/review flow, and Founder gate map."
