      "fragment_sha256": "e5374b9ad6718bb9936d94cb50df9aaa47c08117892a82327f0dcaa4b35eb9a3",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Founder Gates And Detail Sources\n\nNormal Founder creative gates are G0 direction, G1 planning, G2 draft keyframe\nplus audio animatic, G3 reviewed section playback, and G4 final master/release.\nFounder approval remains required for explicit creative locks, final\nPASS/HOLD/REJECT, paid generation, protected-output disposal, external\nmutation/upload, and public release. A worker, script, board, or derived pack\ncannot imply approval. Official/original source eligibility, restricted-edit\npermissions, media security, and smallest-owner rules live in the activated\npolicies.\n\nFor artifact versions, commands, closeout, context, resume, and failure\nhandling, load `production-system-detail.md`. Load these conditional sources\nonly when their trigger is active:\n\n- `policies/creative-production-constitution.md`: creative standards and\n  natural execution language;\n- `policies/harness-routing-and-sources.md`: sources, sessions, models, Grok,\n  context, and route ownership;\n- `policies/section-production.md`: section owner index and compact stage map;\n  load only the bound Front Planning, 01/02A, 02B/pixel, 03V, 04, or workbench\n  chapter for the current checkpoint;\n- `policies/repository-media-security.md`: media, secrets, and external work;\n- owning skill and schema: execution truth.\n",
      "selection_reason": "The pack already carries role and stage ownership; runtime receives only the active route, four-role lineage inside Active Route, Dispatch/review flow, and Founder gate map."
    },
    {
      "binding_id": "creative_constitution",
      "binding_kind": "linked_read",
      "path": "policies/creative-production-constitution.md",
      "revision": "content-addressed",
      "whole_file_sha256": "d5a2f985d9e65bee158b76ab38c542ac9f4e4d8612e6045920acf5011a3fe5ff",
      "locator": {
        "type": "markdown_heading",
        "heading": "Current-Run Creative Source Isolation"
      },
      "fragment_sha256": "c44d6e7cb2489ba032ea4c6cad75c2fe489cc1f82c64ecbd9c30b7b775a9341f",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "### Current-Run Creative Source Isolation\n\nPast-run artifacts, test fixtures, maintenance examples, and historical prompt\nor scene prose are not creative inputs for a new or resumed run. A prior run\nmay contribute a named failure mode, comparison question, or quality invariant\nonly after its distinctive nouns, actions, staging, camera route, composition,\nand prompt wording have been removed. Shared instructions may define decision\naxes, evidence requirements, transport structure, and stop conditions; they\nmust not contain a complete scene or prompt sentence offered as the default way\nto execute those axes.\n\n#### Non-Prescriptive Teaching Example Contract\n\nExcluding shared examples from execution context does not mean deleting them\nfrom skills. A complex creative skill must keep enough examples to show how to\napply its method. These are instructional patterns, not current-run creative\ntruth, and they cannot supply a scene value, prompt value, reference binding,\nor generation input.\n\nA compliant teaching example:\n\n- starts from an abstract Founder note or variable-bearing current-run input;\n- shows the decision axes and more than one materially different carrier or\n  route when explaining directing, camera, motion, or edit judgment;\n- makes the current song, section job, selected reference, title assets, or\n  passed pixels decide which route wins;\n- ends with a role-labelled or placeholder output pattern rather than a\n  complete reusable scene or prompt;\n- states that it is noncanonical and must not be copied into a run.\n\nFor example, a note such as `calm but heavy` should trigger a comparison:\nweight might be carried by restrained subject behavior, pressure or change in\nthe space/object system, a delayed relational consequence, or another route\nsupported by current evidence. Still-camera judgment then compares the\nfunctions the frame must serve—such as intimacy, isolation, obstruction,\nscale, or another reference-derived function—before the director authors the\nactual height, distance, angle, depth, placement, and crop for this section.\nThe teaching output is the pattern\n`current cue -> selected carrier -> observable change or hold -> selected\nstill-camera proof -> continuity consequence`, not a scene sentence.\n\nLikewise, `make it more dynamic` does not imply one camera move. After passed\npixels exist, 03V may test whether the subject, camera, environment, or an\nintentional hold carries the change, then author the exact direction, speed,\nenvelope, depth change, and stop from the current audio and images. No route in\nthis list is a default or quota.\n\nAdmit creative bytes only from the hash-bound current run, its current-title\nmember visuals, or selected source material that the current run has explicitly\ndispositioned. Another run's file must first enter the current run through a\nsource-preserving intake and receive a current function; a repository path,\nsimilar theme, prior success, test convenience, or maintenance history is never\nenough. Context builders and execution request builders must reject test paths,\nmaintenance surfaces, historical prose, and un-intaken files from another run.\n\nReference expansion must solve named screen gaps without flattening the video.\nFor story-led or previously uniform work, inspect the selected pool across story\nsituation, physical space/background, visible subject relation, body/action\nfamily, camera geometry/route, object/world system, and light/material behavior.\nA popular candidate does not count when it repeats the same room, similar people,\nsimilar action, and similar camera answer without a new section function. Seek a\nminimum sufficient diverse set and preserve one coherent target/message/world\nprogression across that variety. For new or materially resumed 01R, sufficiency\nis a contextual CDD judgment against named screen gaps, source-to-screen\ndifference, and actual reviewable visual evidence; a fixed unit,\nsource-identity, function, worker, or room count is never a discovery or\napplication quota. The exact-five one-second Sequence Unit, Core reference\ncoverage, Key Screen function-combination, and Pinterest FP-Close obligations\nremain separate named evidence contracts. Within the compared set, every unit closes as\n`applied`, `combined`, `held`, or `rejected` with a reason. A whole contact\nsheet is not a unit; one\nhash-bound selected cell/crop is one unit, and several cells that describe one\ncontiguous start-through-end event remain one sequence unit. Add or stop only\nwhen the named gap and comparison quality justify it; there is no minimum or\nmaximum discovery count.\n\nEvery selected reference component used in a Major or Key Screen is classified\nas `major_scene_grammar_or_feeling`, `background_and_space`,\n`still_camera_and_composition`, `lighting_color_material`,\n`subject_state_or_pose`, `visible_action_or_hold`,\n`object_environment_response`, or `edit_or_transition`. Its hash-bound analysis\nrecords the exact locator, observed fact, selected component, transfer boundary,\ndo-not-transfer rule, and downstream targets. Each material Core/Key Screen\nbinds exactly one selected primary reference or an exact Founder waiver;\nadditional support is allowed only for a named function that the primary does\nnot own. This is contextual component combination under current\nsong/member/title truth, not a fixed blend quota, vague reinterpretation, or\nwhole-source recreation. A Founder-selected\n`full_scene_direct` or `sequence_direct` source remains governing and cannot be\ndiluted by support functions.\nTarget-related reference expansion must also be audience-causal. Before song\ndirection, PRE-00 profiles the audience draw and rejection triggers of each\nmaterial audience, trend, song/artist, genre/subculture, visual-world, Founder,\nplatform, and market anchor, then drafts two to four typed connections: actual\naudience overlap, shared-reward adjacency, acquisition bridge, or surface-only\nsimilarity. Validate target, common response mechanism, and expected song and\nscreen reward with separate evidence and counterevidence. The Founder locks one\nprimary target only after PRE-00 states audience promise, familiar codes,\nnovelty/tension, content pillars, platform behavior, rejection triggers,\ndo-not-serve rules, current trend opportunity, durable signals,\nexpiry/volatility, evidence freshness, and a do-not-copy boundary. Surface\nsimilarity remains test-only or rejected; this is not permission to merge every\nfandom label.\n\nBefore the target lock, every connection shows one main music-video or other\nvisual reference plus one or two supporting references with exact source and\nlocator, target-response reason, distinct transfer function, and mismatch risk.\nThe main demonstrates the governing audience reward; support fills a separate\ngap. These are selection previews only and must be reinspected and dispositioned\nbefore any Front Planning section use.\n\nSong direction, selected-audio analysis, and Front Planning test fit against\nthat fixed target rather than silently replacing it. Front Planning turns the\nlock into observable screen consequences and derivative implications, then\nbuilds a whole-MV content-role plan from narrative,\ncharacter, relationship, world/system, action, object, space/image, camera,\nedit, and optional performance/choreography. Every supplemental search vector\nmust bind one selected audience connection, one source/reference anchor, one or\nmore content-role ids, one missing content job, one required observation, and\none rejection condition. A source that matches the surface but not the\naudience/content job does not close the gap. Performance is never the automatic\ncontent role merely because the work is an idol MV.\nWhen lyrics exist, carry both the whole lyric surface and the lyric function,\nbut do not make lyric text the default image-planning driver. Selected-audio and\nsection cues are the primary timing anchor; lyric cues are a secondary meaning\nguard unless the lyric line is the actual audible turn. Do not direct from\nfunction labels alone. 01, 02A, 02B, review text, and prompt packets must state\nthe primary audio/section cue and any lyric cue or no-lyric cue that prevents a\nwrong read, then show which visible action, gaze, rhythm, wardrobe motion,\ncamera, composition, and space/object reaction carry it.\nVisual polish, source-scene quality, or edit sync is not a substitute for\nmeaning delivery. If prior run evidence shows that a track worked because the\nmessage/empathy function was carried beat by beat, or felt weaker because the\nmeaning path was less readable, use that lesson when evaluating new\nreference-song fit, selected-audio analysis, 01 direction, and 02A review.\nKeep song-analysis lanes separate. `reference-song fit` analyzes outside\nreference songs before generation and belongs in `research/reference-song-fit-vN.*`.\n`selected-audio analysis` analyzes the actual Suno/manual/founder-returned\ncandidate take after it exists and belongs in\n`research/selected-audio-analysis-vN.*`. Do not use reference-song fit as a\nsubstitute for selected-audio analysis before 00A, Front Planning, 01, or 02A.\nThe selected-audio analysis is\nthe sole canonical read of the actual returned lyrics: retain its full-lyrics\nread and section map there, rather than creating a second lyrics-to-direction\nartifact. Meaning, audience receive, visible action, and banned misreads belong\nto the owning Front Planning, 01, and 02A decisions where they can be reviewed\nagainst the actual screen plan.\nFor video/MV-bound song production, selected-audio analysis alone is not enough\nfor downstream frame/cut authoring. After the latest selected-audio analysis,\ncreate or refresh\n`research/audio-motion-director-map-vN.yaml` before 00A, Front Planning, 01R,\n01, or 02A treats the song as production-ready. This map is the mandatory\naudio-timing evidence bridge: preserve selected audio/section cues, optional\nliteral original lyric text when its words must travel, backing\ndrum/percussion/bass triggers, high-transient grids, vocal holds, silence,\nmotif returns, texture-density changes, and the questions those facts leave for\nFront Planning. It must not author member, reference, scene, body action,\nchoreography, styling, still-camera geometry, temporal camera motion, branch-cut\ncount, prompt prose, or final edit timing. Do not call a video-bound\nselected-audio pass complete if it only has BPM, broad section labels,\nautomatic novelty boundaries, or a lyric summary.\nFor IDOL song/MV production, Front Planning must not lock its creative spine\nfrom message or visual concept alone. It needs concrete song support: selected\nor promising Founder-returned audio, a Founder-provided song/source anchor, or\nan explicit Founder-locked manual audio direction. When no song exists yet,\nstay in PRE-00/PRE-00S/Suno prompt exploration until a song source exists.\n\n",
      "selection_reason": "Runtime roles receive current-source, observable-language, contextual-review, authorship, and asset rules."
    },
    {
      "binding_id": "creative_constitution",
      "binding_kind": "linked_read",
      "path": "policies/creative-production-constitution.md",
      "revision": "content-addressed",
      "whole_file_sha256": "d5a2f985d9e65bee158b76ab38c542ac9f4e4d8612e6045920acf5011a3fe5ff",
      "locator": {
        "type": "markdown_heading",
        "heading": "Concrete Review And Prompt Language"
      },
      "fragment_sha256": "091c0fb93bf84dce7b92547f9c4e886412a57d189d9e37921b4be94071587443",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "### Concrete Review And Prompt Language\n\nFounder-facing review units, 02A storyboard text, 02B prompt packets, and\npost-review video prompts must be grounded in observable screen language. Do\nnot leave internal analysis terms, undefined music/film jargon, or\nimpressive-sounding mood phrases as the only thing the founder or generator must\ninterpret.\n\nDirectorial explanation and render/contract prose have different jobs:\n\n- Founder-facing directorial prose may open naturally with feeling, relationship,\n  dramatic purpose, or a question of taste. Pair it in the same review unit with\n  a separate screen-proof sentence or a clear pointer to the canonical fields;\n  do not force every conversational sentence to carry the full technical read.\n- 02A/02B/03V prompt prose and creative handoff fields are execution surfaces.\n  They must carry the observable detail needed to make or continue the work.\n- Automation status reports state, provenance, and gates. It must remain clear,\n  but it is not a substitute for, or a compressed version of, creative prose.\n\nFor this rule, creative operator-facing fields include Cursor/Grok handoff text\nand any field prose another agent must use to continue a creative decision.\n\n#### Natural Language, Creative Registers, And Prompt Translation\n\nApply the language standard across Korean, English, and other working\nlanguages. Conversation, explanation, analysis, review, and Founder-facing\nprose should sound like language a fluent speaker would plausibly use in the\nrelevant conversation, writers' room, music session, or directing meeting.\nPrefer clear subjects, ordinary verbs, and direct causal sentences over\nhabitual literal translation, inflated critical language, noun-heavy\nabstraction, or decorative personification. An artistic idea may be complex;\nits explanation should not sound obscure merely to sound cinematic.\n\nKeep the creative and execution registers distinct:\n\n- Lyrics, titles, hooks, slogans, and authored creative text may be abstract,\n  metaphorical, ambiguous, fragmented, contradictory, surreal, repetitive, or\n  driven by sound and image rather than literal explanation. Judge them by\n  intention, voice, sound, singability, internal imagery, emotional effect,\n  progression, and memory. Do not rewrite them into plain screen directions.\n- Story concepts may be poetic, associative, nonlinear, unresolved, or\n  intentionally withholding. A production handoff needs the state, event or\n  intentional hold, transition, and consequence required to continue the work,\n  but it must not force every story into literal cause-and-effect or explain\n  away a selected ambiguity.\n- Image, video, storyboard, and edit prompts may retain a short abstract intent,\n  but must pair it with the visible conditions the surface can execute. For\n  example, \"the subject feels spatial pressure\" is not sufficient by itself;\n  name the wall or object spacing, subject placement, foreground occlusion,\n  depth, lens or shot scale, crop, light boundary, and movement or hold that\n  make the pressure visible.\n- Music and style prompts may use an abstract feeling when it is useful, but\n  pair it with the audible behavior that should produce it: rhythm, density,\n  register, harmony, vocal distance, texture, silence, transition, or dynamic\n  change. A lyric-writing prompt may deliberately request abstraction or\n  ambiguity and does not need to convert each lyric image into a literal event.\n\nDo not mechanically blacklist abstract words. Revise them when they conceal a\nmissing decision, create unnatural phrasing in the active language, could be\ncopied unchanged into unrelated work, or add an appearance of depth without\nadding meaning. When translating a lyric, metaphor, or poetic story into\nproduction direction, preserve the source meaning and add only the execution\ninformation needed by that downstream surface. Schema and enum identifiers may\nretain compact transport shorthand. Treat those tokens as transport labels only;\nFounder-facing prose and generator prompts must restate the actual audible or\nvisible behavior in natural language.\n\n",
      "selection_reason": "Runtime roles receive current-source, observable-language, contextual-review, authorship, and asset rules."
    },
    {
      "binding_id": "creative_constitution",
