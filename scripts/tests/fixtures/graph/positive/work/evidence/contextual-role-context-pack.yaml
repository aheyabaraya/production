      "fragment_sha256": "914bcdb7197a33df783455a7dd0c4462544449cc3cd9f2dc25baf62b58f34135",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Dispatch, Context, Review, And Revision\n\nEvery delegated task binds the Department Dispatch Contract, exact skills and\nlinked EOF reads as a mechanically validated dependency inventory, Founder\nepoch/locks, input digest, owner/write scope,\npermissions, output paths, stop conditions, and return recipient. Overall owns\nthe whole-stage route from startup and assigns the one CDD room for each\nPlanning lane or section cohort its current\ncheckpoint; it does not replace that CDD each assignment. CDD/FP/02A multi-leaf\nparent-scoped helpers and the post-song reference worker fetch floor are in\n`automation/harness-execution-contract.yaml` `session_and_helper_operating_lock`.\nThat CDD owns the film (storyline, target, references, members,\nsection jobs) inside its lane or cohort through 03V and transmits the complete job. A worker receives\nthat job and does not load the whole graph-engineering route. Keep the whole-film route\nas film truth: Overall for stage legality, cross-cohort promotion, and\nwhole-video judgment; each CDD for the film inside its lane or cohort\nthrough 03V. The shared\nprovider-neutral Studio Kernel supplies the fixed twelve-block command and the\nselected profile/checkpoint; after native Goal admission, the deterministic\nprojector verifies the registered source closure to EOF and emits one exact\n`idol-role-context-pack.v1`. The receiver applies that pack plus the named\ncurrent creative sources. This replaces broad runtime instruction rereads and\ndoes not become an additional authority or prompt layer. The director authors\nthe Current Assignment Delta; repeated method is reused from the registered\nrecipe and not copied into a manual provider prompt.\n\nIf the current run has a valid v3 Founder-feedback sidecar, the same pack also\nprojects only the exact role/profile/stage/section-matching compact quality\npatterns. CDD/Overall/Edit receive the current-run review view; workers receive\ntheir exact section view. Each pattern carries a short reason, recurrence\ncount, bounded positive/avoid/action/review signals, and source sidecar digest,\nnever the raw Founder quote or transcript. This semantic edge helps the\nreceiver judge the current output but creates no lock, gate, automatic taste\nrule, or creative PASS.\n\nWhen physical Git isolation is useful, `wiki/artifact-management-system.md`\nprojects the same single-writer Dispatch as `main -> run integration -> bounded\nlane worktree`. A Git lane is optional transport, not a stage or creative\nbranch, and its accepted diff returns only to the named Director before the run\nintegration branch can reach `main`.\n\nCDD and workers wait for `final`, `hold`, `authority_request`, or `milestone`;\nthe wake payload is pointer-only (output/manifest, decision, risk, and hashes),\nnever raw commentary. `returned` is not PASS: CDD closes worker requirements against the pack, named\ncurrent-run sources, the same checkpoint closure cards, and the exact returned\nbytes; then Overall reviews the curated milestone and promotes sequentially. A\nmulti-file return exposes one aggregate manifest with exact child paths and\nSHA-256 values. Dispatch records stay at\n`RUN/work/department-dispatches/DISPATCH_ID.yaml`; outputs and manifests stay\ninside that same album/title/run, never a global `runs/workers` lane.\n\nA review cycle has at most three total submissions, including the initial\nreturn. `review_submission.submission_number` is separate from\n`lineage.attempt_number`, so normal checkpoint progression remains uncapped.\nAfter a non-accept review, the Director returns one complete correction unit\nwith all observed problems, exact invalidated output hashes, correction action,\nand acceptance criteria. Submission 2 or 3 opens a new immutable attempt and\nnative Goal for only those invalidated paths; unaffected outputs are\nhash-frozen. Thus one failed cut in a ten-cut return reopens only that cut. A\nthird submission may pass; otherwise it routes upstream or HOLD and cannot open\na fourth child submission. Session, provider, model, or Founder-epoch changes\ndo not reset the same work package. Unchanged input/result bytes and Founder\nepoch still reuse the same review receipt.\n\nThe three-submission limit applies to creative returns, not receipt repair.\nCorroborated hash-only drift closes through one run-local mechanical refresh\nreceipt, with no worker session, native Goal, semantic re-review, or submission\nincrement. A real input-byte change routes once to the original recipient\nDirector for an impact decision before any worker is reopened; changed output\nbytes remain a quality HOLD. This prevents one solved job from circulating\nbetween workers solely because a duplicate hash field disagrees. The aggregate\nreturn shows one transport-closure summary; raw receipts stay folded unless an\nunresolved error changes Director action.\n\nAll visual decisions use one cumulative `idol-html-review-board.v12` G-00--G-70\nlineage. Route a\nchange to the smallest owner—Front Planning for central locks, 01 for section\ndirection/Core, 02A for Branch/composition/binding, image packet for render wording,\nexact output for pixels, 03V for motion, and 04 for edit—and invalidate only\naffected descendants.\n\n",
      "selection_reason": "The pack already carries role and stage ownership; runtime receives only the active route, four-role lineage inside Active Route, Dispatch/review flow, and Founder gate map."
    },
