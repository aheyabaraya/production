      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "### Authoring Method Versus Transport Contract\n\nSkills and linked creative modules own authoring method: the questions a\ndirector asks, the alternatives worth considering, and the contextual judgment\nthat makes a scene, relationship, camera route, reference use, or Core-Cut/Branch-Cut\nsplit convincing. A schema may carry selected creative truth so another stage\ncan receive it. The active exactly-three FP routes and 2--4 decision candidates\nare transport-completeness floors for a reviewable comparison, not a machine\nquality score or command to generate every Cartesian combination. Other fixed\nalternative counts, camera-vocabulary pools,\nbody-part checklists, prompt labels, repeated keywords, and prose shapes must\nnot become creative-readiness conditions. Optional vocabularies stay optional\neven when they are structured.\n\nSeparate creative values from transport categories. Cut roles, layout families,\nshot scope/crop, camera position and route, subject direction, head/gaze\nrelation, occlusion, action, and composition are scene-specific human/model\nauthorship and must accept ordinary natural language. Closed\nvalues may remain only where downstream logic needs a routing, safety,\npermission, provider, approval, or lifecycle category. Such a category cannot\nstand in for the actual authored direction. Once a human/model selects and the\nowning stage approves a creative value, downstream stages preserve that exact\nvalue; openness before selection is not permission to drift after the lock.\n\nSchemas, validators, compilers, automation, and review-surface builders own\ntransport and state: types, enums, ids, paths, SHA-256, exact source coverage,\npointer and exact-copy integrity, output ownership, execution parameters,\nreceipt provenance, and approval state. They may verify that a declared\ncreative payload exists and arrived unchanged. Only section and whole-video LLM\nreview may decide whether it is specific, coherent, rich, plausible,\nrepetitive, or ready for revision. A deterministic tool must not repair missing\ncreative truth by expanding a template or demanding synonyms.\n\nThe first Front Planning-to-02A pass is the model's autonomous quality\nbootstrap. After the Founder directly changes an exact reference connection,\nimage screen truth/render prompt, or video prompt, that named decision is the\ncreative judgment for its scope. Record a hash-bound Founder direct-update\nreceipt, revise the smallest owning surface, and carry forward unaffected\nbootstrap truth. Do not require the Founder to refill earlier plans or insert\nanother LLM taste verdict. Deterministic integrity, identity/reference, safety,\nfeasibility, pixel/playback, and external-approval checks remain independent\nand may still hold the work for an objective defect.\n\nThe shared image profile has one narrow direct-authoring exception to avoid\nunnecessary upstream rewrites: after a passed planning Hero, 01 Core, or 02A\nBranch exists, a human or assigned model may author a hash-bound\n`direct_prompt_revision` for that Cut's final render prompt. It may revise\nscene/world, visible details, action/gaze, camera/composition/crop,\nwardrobe/material, and negative wording. It must retain the hash-bound Cut lock,\nparent timing/section/Major ownership, Cut id/sequence, current-title asset\norder, visual-reference-binding order,\nexplicit Founder locks, and expected output path. Before authoring, the owner\ninspects the exact Cut, all bound current-title visuals, and all selected\nreference derivatives, then records their hash and complete order in the\nauthoring-inspection receipt. `Visible details` separately authors\nbackground/space, still-camera/composition axes, and light/color/material;\n`Action cue` separately authors subject state/pose, visible action/hold, and\nobject/environment response. The compiler and execution adapters only validate\nthe receipt, exact-copy bindings, and serialize fixed labels/separators around\nalready-authored components; they may not claim inspection or write, infer,\nrepair, pad, or paraphrase creative values. Each revision creates a new\nprompt hash and therefore requires fresh 02B validation, review, request, and\ncurrent-job approval before generation. A structural, reference, identity,\nFounder-lock, or output-path change remains at the owning FP/01/02A stage.\nWhen that upstream change is Founder-authored after a previously passed\nbaseline, update only the affected 02A section and its descendants; the\nhash-bound direct-update receipt replaces a repeated creative-context advisory\nreview for the changed fields, not the integrity or Founder generation gates.\n\nIn the legacy-pinned branch, after 02A merge, CDD reviews every visual section with its adjacent boundaries,\nthen continues through actual image and 03V playback. Overall reviews CDD's\ncurated milestones and reconciles the entire film: story and relationship\nprogression, world/action escalation, camera/edit progression, reference\nfidelity, recurrence/reprise, climax, release, and ending. The same Overall\nDirector owns the recommendation and acceptance; there is no mandatory second\ndirector or automatic Sol/Max final gate. When one named contradiction remains,\none bounded\nadversarial adviser review may advise that continuing director. It cannot promote,\nveto, or become a second Founder-facing authority. Cursor and Grok adapters use\nthe same provider-neutral roles and promotion boundary. The result appears in\nthe existing 02A Founder review cycle; a separate proposal page is not the\napproval surface.\n\n- A production-ready storyboard/prompt packet, or a founder review unit, must\n  collectively establish the applicable screen truths: who is visible when a\n  member is visible, where the screen event happens, what body, object,\n  environment, or camera-route action happens, which audio/section cue triggers\n  it, which lyric cue is only a meaning guard when relevant, what the face or\n  gaze does when a face is visible, what composition holds the image together,\n  and how the camera sees the event. Each field carries the truth it owns; it\n  need not repeat the whole production read. Put only the details needed for\n  that cut or review decision on the displayed surface; canonical fields retain\n  the complete production read.\n- When the founder provides a visual board, moodboard, or contact-sheet-style\n  board, analyze it into text locks before prompt or review writing: concrete\n  background/world objects, wardrobe silhouettes, materials, color limits,\n  lighting behavior, body-proportion risks, and reject terms. Store the analysis\n  in Front Planning and carry it through 01, 02A, and 02B. Do not leave the board\n  as a loose vibe reference. The selected current-title member visuals and\n  exact scene cells/crops remain image inputs when their pixels are necessary;\n  space/background direction stays in Major/Key Screen text and scene refs. A\n  text summary is not a substitute for a required visual.\n- Still composition and still-camera specificity must be decided before 02B,\n  preferably in 02A. Use the\n  existing fields first: `visual_frame.camera_treatment`,\n  `director_chain.must_show.camera`, `director_scene_lock.required_camera_evidence`,\n  and `image_review.review_question`. Those fields should already name the\n  baseline camera geometry: camera height, camera-to-subject distance/shot\n  scale, camera direction/angle, and foreground/background depth. That four-axis\n  check is the minimum, not the whole camera decision. The same field should\n  also name subject/object placement, floor/reflection, negative space or crop\n  pressure, color/light balance, visible action or hold, member-to-space or\n  object-to-space balance, and the reason the framing makes the section, action,\n  rhythm, and any carried original lyric text readable. When later video motion\n  is plausible, those same existing natural-language fields also preserve its\n  visible prerequisites: action axis and screen direction, lead/travel/reveal\n  room, foreground/middle/background separation, a physically legible path or\n  occlusion, crop/edge safety, and the continuity carrier into the adjacent\n  screen. This is `motion readiness`, not authorization for a temporal move.\n  02B compiles from those fields into existing\n  prompt-packet camera/framing fields; it must not invent a new still-camera\n  idea. Temporal camera movement, speed, envelope, path, reveal, and stop are\n  authored only in 03V after passed Production Cut pixels of type\n  `official_core` or `branch` exist; 03V may\n  revise an upstream motion hypothesis when pixel inspection proves it\n  unsupported, while preserving the passed still state or returning to the\n  smallest owning stage.\n- If a music term is useful, translate the actual cue into the current\n  section's already-authored visible response, naming its timing and physical\n  geometry. A safe teaching pattern is\n  `actual cue -> selected current carrier -> observable change or hold ->\n  framing/readability consequence`; it demonstrates the translation without\n  choosing a stock gesture or reusable action sentence.\n- Choreography appears only where Front Planning and 01 mark it `primary` or\n  `supporting`, and it must bind an actual choreography, performance, or fancam\n  reference. Translate the inspected phrase into ordered foot route, weight\n  shift, body level, torso/hand path, gaze, garment reaction, and readable\n  branch-cut body states. A dance-style label or invented generic pose sequence\n  is not sufficient. Sections marked `absent` stay non-dance; do not add dance\n  even as negative prompt vocabulary.\n- Lyric words are cues, not action names. Keep raw lyric text in lyric/source\n  fields. In action, must-show, review, image-prompt, and video-prompt fields,\n  use the current section's interpreted result and state the observable\n  body/object/environment behavior and camera consequence without borrowing a\n  stock gesture from shared guidance. The teaching pattern is\n  `lyric meaning guard -> current section interpretation -> selected visible\n  proof`, never `lyric word -> fixed action`.\n- Do not let abstract placeholders such as \"space reacts\", \"emotion grows\",\n  \"camera evidence\", \"body evidence\", \"close but distant\", \"quiet pull\", or\n  \"controlled pressure\" stand alone. In a founder review, pair the thought with\n  a nearby screen-proof sentence or the linked canonical field. In a\n  render-facing prompt or structured creative field, include the visible action\n  and camera/composition detail in that field. This execution requirement does\n  not prohibit abstract, metaphorical, or ambiguous language in the source\n  lyric or authored story.\n- When the founder gives concrete wording, preserve it as high-priority input\n  and do not paraphrase away its intent. If it is not an explicit lock and would\n  weaken identity, safety, schema validity, feasibility, originality, or the\n  selected-song screen result, surface the conflict and recommend stronger\n  wording or direction before asking for a final lock.\n\n",
      "selection_reason": "Runtime roles receive current-source, observable-language, contextual-review, authorship, and asset rules."
    },
    {
      "binding_id": "creative_constitution",
      "binding_kind": "linked_read",
      "path": "policies/creative-production-constitution.md",
      "revision": "content-addressed",
      "whole_file_sha256": "d5a2f985d9e65bee158b76ab38c542ac9f4e4d8612e6045920acf5011a3fe5ff",
      "locator": {
        "type": "markdown_heading",
        "heading": "Asset Alignment"
      },
      "fragment_sha256": "cd5049153778af27c88d4784367733aa4c46b2ef168751bcc2177ad6ad6d2f6c",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Asset Alignment\n\nAll song, choreography, performance direction, MV direction, generation, and edit\nplanning must align with the active member assets:\n\n- member code, name, role, signature move, performance-use role, and visual\n  language from `assets/member-registry.yaml`\n- vocal/rap color, best-use rail, section use, and prompt guard from\n  `assets/voice-style-index.md`\n- unit membership, unit purpose, center roles, and unit recommendation limits\n  from `assets/unit-registry.yaml`\n- current-title member visual assets under\n  `assets/members/album-assets/ALBUM_KEY/TITLE_KEY/**`\n\nRequired member visuals are newly built or bound and reviewed with their Major\nStacks and material Core candidates for each album/title in Front Planning.\nPassed member visuals are that\ntitle's downstream appearance defaults; omission or replacement requires the\nexact Founder-approved exception. No separate background/world asset package is\ncreated. Space/background direction remains in Major/Key Screen text and exact\nscene references.\n\nThe assets are base identity material, not a command to reuse the same outfit,\nmaterial, world, hand phrase, choreography, camera language, or member-led frame\nstructure in every song. Face identity and member role continuity must survive\nwhen members are visible, but the screen driver may be member-led, unit/group-led,\nworld/object-led, an environment insert, a system transition, or a mixed\nmember/world beat. Styling, wardrobe material, world design, hand language,\nchoreography, object behavior, camera route, and section framing should be newly\ndesigned from the current song feeling, message, and section function.\nFace-only is the sole approved facial-identity source for member-visual builds\nand registered identity-input requests. After a current-title card passes, the\nactive image-input route has no separate downstream face-only lane. Retired\n`no-mic`/`no_mic` variants are invalid. A current-title member visual controls\nappearance continuity only when the member is\nmeaningfully visible; it never forces a readable or frontal face, gaze, pose,\ncrop, camera, or proportion. These modes coexist. Member-led, center, closeup,\nbeauty, and choreography\nframes remain valid when the song function is identity, vocal ownership,\nperformance proof, hook memory, or emotional read. World/object-led,\nenvironment-insert, camera-route, and system-transition frames are added options\nfor sections where the lyric, rhythm, transition, or story job is better carried\nby space, objects, camera movement, or a visible system. Do not apply an\nautomatic quota in either direction unless the founder explicitly sets one.\n\nUntil the founder explicitly unlocks it for a specific run, do not use ancient\nor medieval costume direction. Avoid historical court dress, fantasy medieval\nrobes, armor, period gowns, dynasty/empire styling, or any wardrobe cue that\npulls AURORA-M away from contemporary idol/MV styling.\n\nDo not invent ages or birthdays. External web references to real people, idols,\nvoices, styling, or performance may be recorded and used as creative reference\nanchors when the founder or current run names them, but they do not become\nmember facts unless the founder explicitly locks a new identity direction.\n\nWhen a creative idea conflicts with member assets, preserve member identity and\nadapt the idea unless the founder explicitly approves a new identity direction.\n",
      "selection_reason": "Runtime roles receive current-source, observable-language, contextual-review, authorship, and asset rules."
    },
