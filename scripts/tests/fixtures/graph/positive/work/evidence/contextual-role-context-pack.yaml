    {
      "binding_id": "planning_p3_section_kinetic_mode",
      "binding_kind": "linked_read",
      "path": "skills/idol-planning-cdd/references/section-kinetic-architecture.md",
      "revision": "2",
      "whole_file_sha256": "c847d8a5a6c3d025beb41789e37db91a20e05407cd4fdf288c8e2bf6ae2a579e",
      "locator": {
