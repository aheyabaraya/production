      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Admission"
      },
      "fragment_sha256": "09adb89c637d165aa7d1f16be605f5ad132e189c5625afea6d00a5d9b45604ce",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Admission\n\nRequire:\n\n- exact run, Founder epoch, active storyline/audio heads, and planning\n  checkpoint;\n- one `planning_cdd_mode` and its unique graph lane id;\n- exact writable Decision Set paths and read-only cross-lane inputs;\n- a `frontier_director` provider receipt with no fallback;\n- Department Dispatch, native Goal, Role Context Pack, input digest, output\n  manifest, return recipient, and stop conditions;\n- physical generation `primary` or `successor`, never a third lane session;\n- proof that no other active owner writes the same planning fields.\n\nP3 additionally requires selected audio, a provisional section boundary map,\nand one exact `planning_section_cohort_id` covering 2--3 contiguous sections,\nexcept one explicit singleton when the whole title has only one section. Do\nnot launch P3 early to fill capacity. Hold on missing, stale, overlapping, or\nmultiply owned inputs.\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Shared Workflow"
      },
      "fragment_sha256": "4923a8476028aab9dd6174d3bcd72239e1fec71b75060d9c0fdbcef942f2c2e1",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Shared Workflow\n\n1. Restate the named planning gap and observable screen consequence.\n2. Dispatch only disjoint `research_medium` or `worker_high` packages needed to\n   close it. Provider capacity is a ceiling; lane backpressure stops launches.\n3. Review exact evidence, not worker self-scores or schema presence.\n4. Author one lane-owned Decision Set with preserved truth, changed truth,\n   evidence pointers, alternatives, risks, invalidations, and next legal action.\n5. Grade applicable criteria on the 0--4 Director scale in\n   `policies/section-production-front-planning.md`. Scripts may not invent a\n   grade. An average, total, or schema PASS is not admission.\n6. P2 and every P3-Ci return the reviewed Decision Set only to P1 through the\n   exact-link route. P1 alone returns the integrated Planning Cell milestone to\n   Overall. A cross-lane conflict travels inside the P1-bound Decision Set as a\n   compact conflict capsule; it is not a second P3-to-Overall return route.\n\nP1 is the only planning integration writer. It exact-links P2/P3-Ci reviewed\nDecision Sets and may add connective planning prose in its own scope. It may\nnot silently paraphrase, erase, or reverse their decisions. A material conflict\nbecomes a compact conflict capsule for Overall.\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Disjoint Decision Sets"
      },
      "fragment_sha256": "ecb0006f10e4fc1bc665988f6f06a2c17d1cac5ebab7baec0f2d3b1f23882a92",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Disjoint Decision Sets\n\nWrite only the fields named by the active mode. P1, P2, and each P3-Ci never\nco-author the same planning field.\n\n| mode | unique write scope | must not write |\n|---|---|---|\n| P1 | PRE-FP lock projection, storyline descendants, message progression, song/screen reward, route recommendation, exact-link integration | visual/reference dispositions, section/Major/Sequence/Core topology, still-camera authorship, kinetic structure |\n| P2 | source eligibility, four-role reference dispositions, identity/world/look/composition evidence, motion-evidence coverage, transfer boundaries | storyline original/descendants, section roster topology, G-40 handoff prose |\n| P3-Ci | that cohort's section jobs, Major/Sequence/Core marks, still camera/composition, 2--3 second kinetic tendency, motion readiness, Draft Keyframe Proof requirements | another cohort's sections, P2 source dispositions, P1 storyline root, 02B pixels, 03V temporal motion |\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Contextual 0--4 Grades"
      },
      "fragment_sha256": "c70e4d71898d48c51caa788284b3d08b5d4b2cfbf2cfa1faf3747084ab541bb0",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Contextual 0--4 Grades\n\nCo-load `idol-contextual-creative-judgment` and apply only the exact\n`judgment_profile_id` in the Role Context Pack. In Graph v2, the common prose\njudgment is the only newly authored score artifact. It records observable\nconsequence, preserve/change/do-not-infer, correction, acceptance evidence, and\nthe next legal edge. The older planning vector remains parse-only legacy-pinned\nevidence and must not be co-authored for the same Graph judgment.\n\nAssigned Directors grade actual media and named context. Meanings:\n\n| grade | meaning | allowed state |\n|---:|---|---|\n| 4 | can govern the main judgment; actual screen evidence is sufficient | promotion eligibility only |\n| 3 | strong, but needs combination or a small correction | internal combine/correct |\n| 2 | valid comparison evidence, too weak as a production input | held evidence only |\n| 1 | low value in the current work | reject |\n| 0 | collides with a PRE-FP lock, source, identity, or execution condition | hard reject/hold |\n\nPromoted items require grade 3 or higher on every required criterion named by\nthe checkpoint and grade 4 on both motion and still-camera/composition for every\nmaterial Major. Record stage-appropriate criteria in\n`idol_graph_contextual_judgment.v1`; never reuse a planning profile as the\ngenerated Production-Cut pixel or playback profile. A grade is not\nautomatic PASS. Local, Pairwise, and Overall Global review of exact bytes remain\nmandatory. Optional criteria stay `not_applicable` with a reason; do not invent\ndummy references to fill them. Performance readability is graded only when\n`performance_mode` is `supporting` or `primary`. Target empathy and message are\nPRE-FP locks, not repeated downstream scores.\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Graph Contract"
      },
      "fragment_sha256": "f87a239314930ce62ae3d0d3201b3a832661207574c41f142f1edaf6929b668a",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Graph Contract\n\nEmit typed node and edge evidence rather than a second creative artifact:\n\n- node identity, mode, owner, provider session, Goal, checkpoint, and state;\n- `owns`, `dispatches`, `returns_to`, `reviews`, `derives_from`, `supports`,\n  `contrasts`, `transforms`, `invalidates`, and `requires` edges as applicable;\n- exact input/result digests and output hashes;\n- `proposed`, `running`, `returned`, `reviewed`, `promoted`, `hold`,\n  `invalidated`, or `retired` state.\n\nScripts may validate this topology and provenance. They may not invent a story,\nreference function, screen consequence, grade, conflict resolution, Founder\nlock, or creative PASS.\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Succession And Retirement"
      },
      "fragment_sha256": "1e26517c8ed84218db250d936f39e9b6ee4a78b3ba55c488a54fbcce1cb586c1",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Succession And Retirement\n\nEach logical lane permits one physical primary and one successor per stage.\nUse a compact successor pack and lane-local single-writer CAS. If the successor\ncannot close the checkpoint, narrow unowned worker scope or return HOLD; never\nspawn a third Planning CDD session automatically.\n\nAfter Founder G2, P1 alone exact-links the reviewed P2/P3-Ci Decision Sets and\nemits one hash-bound G-40 Planning Cell handoff. P1/P2/P3-Ci then become\nread-only rollback points. They do not write 02B pixels or 03V motion. Each\npost-G-40 Section-Cluster CDD exact-carries the same `section_cohort_id` into\nits disjoint 2--3-section cohort.\n\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "planning_cdd",
      "binding_kind": "skill",
      "path": "skills/idol-planning-cdd/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "334747fee036f35ac1937234c20ea874923d7394e220300889e17c8b6fd74a68",
      "locator": {
        "type": "markdown_heading",
        "heading": "Return"
      },
      "fragment_sha256": "227076d7fe87759c15c29734deefa042a14c17de02e8bd7c3fd0cc1bb6dfbc12",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Return\n\nReturn a compact lane manifest containing:\n\n- lane/mode, checkpoint, physical generation, provider receipt, and state;\n- reviewed Decision Set pointers and hashes;\n- 0--4 grades with evidence locators, N/A reasons, and no aggregate score;\n- evidence and actual media locators needed to inspect the decision;\n- cross-lane dependencies, conflicts, holds, and invalidated descendants;\n- integration status, recipient, and next legal action.\n\nFor P2/P3-Ci the recipient is always `planning_cdd_p1` through\n`planning_cdd_p1_exact_link`. Only P1 may name Overall as the Planning Cell\nreturn recipient after exact-link integration.\n\nExclude raw candidate pools, full URL lists, worker transcripts, superseded\nprose, and unrelated lanes. A structural PASS is never creative PASS.\n",
      "selection_reason": "Each Planning CDD lane receives the shared planning method; mode and cohort identity stay in pack fields."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Purpose"
      },
      "fragment_sha256": "93f0b46da79062eacdd74cc40326802b04c3c11213bed44387acfd09ed3afba2",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Purpose\n\nThis is a co-loaded Graph Engineering judgment skill. It does not create a\nstandalone reviewer, replace the owning creative skill, or grant promotion\nauthority. Apply only the exact `judgment_profile_id` projected into the\ncurrent Role Context Pack and only to the hash-bound artifacts named there.\nAuthor the result as `schemas/graph-contextual-judgment.schema.json` and run\n`scripts/validate_graph_contextual_judgment.rb` before returning it.\nThe artifact exact-binds the originating Dispatch, native Goal event, stage-local\nRole Context Pack, evaluated output manifest, author session, and profile-value\nhash. A reviewed Dispatch points to the validated artifact; a prose score copied\ninto a report is not a Graph judgment.\nTo avoid a circular content hash, `execution_binding.dispatch` points to the\nimmutable returned Dispatch snapshot that predates the judgment. The later\nreviewed Dispatch snapshot may point forward to the judgment; neither file is\nrewritten in place.\n\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Scale"
      },
      "fragment_sha256": "14a553ba074e92b92a79b8196a6c6d40f584e3bfdbad807dcdc8216b24e39342",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Scale\n\n- `4`: governing evidence for this scope; the criterion is production-ready.\n- `3`: strong usable evidence; combine or make only a bounded correction.\n- `2`: comparison evidence only; material correction is required before use.\n- `1`: reject for the current work; the proposed transfer would weaken it.\n- `0`: hard collision with a lock, identity, source, feasibility, or screen job.\n\nNever total, average, weight, rank, or convert the vector to a percentage.\nScripts validate range, provenance, profile completeness, and graph routing;\nonly the assigned human or model authors the grade and prose judgment.\n\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Prose Evidence Per Criterion"
      },
      "fragment_sha256": "be19dea7dddb54890d57e2059919acd86746ca1df0c3b0366e96fe43045435a9",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Prose Evidence Per Criterion\n\nFor every applicable criterion write all of:\n\n1. exact evidence locator;\n2. observable claim;\n3. screen or playback consequence;\n4. what must be preserved;\n5. what must change;\n6. what must not be inferred;\n7. correction action;\n8. acceptance evidence that would close the correction.\n\nUse an explicit `not_applicable` row only when the bound profile permits it and\ngive the exact scope reason. Performance readability remains in the exact\nvector as `not_applicable` when the title has no performance job; it is numeric\nwhen performance is supporting or primary.\n\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Stage Boundaries"
      },
      "fragment_sha256": "afa88fe6fcb26c22252e1746db614378a8484afb64ca46e8e6864998ad078a9b",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Stage Boundaries\n\nPRE-FP judges and locks target empathy, audience promise, message progression,\nand the complete opening-to-ending storyline. Later stages do not rescore\nthose locks; they report exact lock violations or observable realization.\n\nReference work judges decision-ready candidates before selection. Preserve the\nwiki reference-function chain from interpretation receipt through Front\nPlanning, 01/02A application, and the 02B role plan. `media_type` describes how\nevidence is inspected; it never replaces `function`. Motion is mandatory for\nevery material Major. Character visual, scene visual package, motion reference,\nand optional prop reference remain the only active roles. A scene visual\npackage may compile world/look/light with still composition, but each function\nis judged separately and their synthesis collision is judged before compile.\n\nThe existing `fp_hero_core` remains the Draft Keyframe Proof surface. 02B\njudges actual generated pixels. 03V and 04 judge actual playback. Planning,\npixel, playback, and edit criteria are not silently reused across stages.\n\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Decision And Graph Edge"
      },
      "fragment_sha256": "aa78bdda6a2dfaf3033583b71a833939556c410ae80a0fa1d15bd370fc283a59",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Decision And Graph Edge\n\n`eligible_for_director_review` requires every applicable criterion at or above\nits profile floor and every named critical criterion at `4`. It means only that\nthe owning Director may review the exact bytes. It is never creative PASS.\n\n- `combine_or_correct` -> `revise_same_owner` for a bounded same-scope change.\n- `hold` -> `return_to_smallest_owner` for missing or stale truth/evidence.\n- `reject` -> `stop` for the candidate or route, preserving the rejection reason.\n- `eligible_for_director_review` -> `director_review`.\n\nThe Director independently checks exact bytes and either promotes, returns a\nbounded correction, or holds. The legal chain is output `judged_by` contextual\njudgment `selects_next` Director review, followed by the Director's `promotes`\nedge to those same bytes. Founder gates remain separate.\n\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
    {
      "binding_id": "contextual_creative_judgment",
      "binding_kind": "skill",
      "path": "skills/idol-contextual-creative-judgment/SKILL.md",
      "revision": "1",
      "whole_file_sha256": "99fd6295ec9f4dd79199805cf2ca18b8da70220f2dd30d5b0f934cf2612b4d9a",
      "locator": {
        "type": "markdown_heading",
        "heading": "Hard Boundaries"
      },
      "fragment_sha256": "c61d5a4a5ffa07fa5bb0e273cbfb1c63b06c1e032c18c94e883c1cfb62078d1a",
      "runtime_read_mode": "inline_exact_fragment",
      "source_read_verified_to_eof": true,
      "content": "## Hard Boundaries\n\n- A hard-gate finding cannot be averaged away.\n- A hard gate or grade `0` routes to `hold`; grade `1` routes to `reject`.\n  Grade `2` or another below-floor result routes to bounded correction or hold.\n- A source URL is not required in the Role Context Pack. Preserve source id,\n  locator, local path, and SHA-256; recover the URL only from intake lineage.\n- Do not infer creative truth from schema validity, provider success, or file\n  existence.\n- Do not repeat target/message scoring downstream of PRE-FP.\n- Do not allow a low candidate score to mutate the selected storyline or lock.\n- Do not create a new `02A Draft` artifact type.\n",
      "selection_reason": "Every creative checkpoint receives one shared evidence language while the pack carries only its exact stage profile and criteria."
    },
