    compact_exclusions: [raw_search_pools, full_url_lists, completed_worker_transcripts, superseded_prose, unrelated_section_or_cohort_media, graph_engineering_policy_explanations, other_provider_tool_detail]
    succession:
      logical_lineage: one_per_lane
      physical_generation_max: 2
      third_session: hold_never_auto_spawn
      cas_required: true
      source_after_cas: read_only_rollback_point
