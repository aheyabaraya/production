schema_version: idol-graph-skill-load-profiles.v1
status: shadow_not_default
authority: derived_read_only_no_creative_or_promotion_authority

activation:
  default_writer: legacy_pinned
  graph_v2_requires: verified_default_switch_receipt
  existing_runs: legacy_pinned
  dual_active_writer: fail_closed
  historical_harness_ids: parse_only_legacy_capsule

registry_policy:
  provider_neutral: true
  exact_paths_only: true
  phase_loaded: true
  no_implicit_fallback: true
  hash_binding: sha256_current_bytes
  runtime_proof: graph_department_dispatch_lifecycle
  node_exact_packs: true
  no_fixed_cdd_count: true

legacy_boundary:
  parse_only_id_prefixes:
    - harness-
    - idol-harness-
    - idol_harness_
  active_authoring_forbidden_id_prefixes:
    - harness-
    - idol-harness-
    - idol_harness_
  ordinary_runtime_must_not_load_legacy_capsule: true

cohort_instantiation:
  source: section_roster_derived
  partition_rule: contiguous_2_or_3_when_two_or_more_sections
  singleton_rule: one_section_title_only
  capacity_may_not_create_cohort: true
  every_section_maps_once: true
  p3_identity_carries_to_v: true
  one_section_output_writer: section_image_motion_worker
  one_cohort_cdd_reviewer: section_cluster_cdd_ci

