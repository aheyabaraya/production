profiles:
  - profile_id: overall_director
    profile_kind: exact_node
    node_class: overall_lane
    role: overall_director
    provider_neutral: true
    logical_tier: frontier_director
    stage_ids: [creative_route_discovery, front_planning_integration, mv_storyboard_direction, master_package_release]
    required_skill_ids: [orchestrator, contextual_creative_judgment]
    required_read_ids: [agents, production_system, creative_constitution, routing_policy, section_production_policy, provider_neutral_studio_kernel, orchestration_routing_detail, department_dispatch_schema, role_context_pack_schema, graph_director_session_router_state_schema, graph_run_controller_state_schema, graph_default_routing, graph_skill_load_profiles_schema, graph_role_context_projection_schema, graph_default_routing_schema, graph_department_dispatch_schema, graph_director_lineage_schema, graph_stage_registry, graph_production_review_schema]
    phase_load:
      preload_skill_ids: []
      preload_read_ids: []
      checkpoints:
        - checkpoint_id: exact_returned_work_review
          stage_ids: [creative_route_discovery, front_planning_integration, mv_storyboard_direction, master_package_release]
          activation: assigned_independent_review_of_exact_returned_work
          required_skill_ids: [orchestrator, contextual_creative_judgment]
          required_read_ids: [agents, production_system, creative_constitution, routing_policy, section_production_policy, provider_neutral_studio_kernel, orchestration_routing_detail, department_dispatch_schema, role_context_pack_schema, graph_director_session_router_state_schema,
            graph_run_controller_state_schema, graph_default_routing, graph_skill_load_profiles_schema, graph_role_context_projection_schema, graph_default_routing_schema, graph_department_dispatch_schema, graph_director_lineage_schema, graph_stage_registry,
            graph_production_review_schema]
          fresh_input_digest: true
          same_lineage: true
          unload_after: director_return
        - checkpoint_id: director_startup
          activation: dispatch_launch
          required_skill_ids: [orchestrator]
          required_read_ids: [agents, production_system, creative_constitution, routing_policy, section_production_policy, provider_neutral_studio_kernel, orchestration_routing_detail, department_dispatch_schema, role_context_pack_schema, graph_director_session_router_state_schema, graph_run_controller_state_schema, graph_default_routing, graph_skill_load_profiles_schema, graph_role_context_projection_schema, graph_default_routing_schema, graph_department_dispatch_schema, graph_director_lineage_schema, graph_stage_registry]
          fresh_input_digest: true
          same_lineage: true
          unload_after: director_return
        - checkpoint_id: g40_planning_cell_handoff
          judgment_profile_id: front_planning_close
          stage_ids: [front_planning_integration]
          activation: founder_g2_passed_p1_g40_handoff_ready
          required_skill_ids: [orchestrator, contextual_creative_judgment]
          required_read_ids: [agents, production_system, creative_constitution, section_production_policy, provider_neutral_studio_kernel, department_dispatch_schema, graph_director_session_router_state_schema, graph_run_controller_state_schema, graph_default_routing, graph_department_dispatch_schema, graph_director_lineage_schema, graph_stage_registry]
          fresh_input_digest: true
          same_lineage: true
          unload_after: director_return
    output_contract:
      kinds: [director_development_report, decision_set]
      canonical_write: owner_only
      expected_scope: run
      aggregate_manifest_when_multiple: true
      director_review_required: true
    authority:
      assigned_owner: overall_director
      review_owner: overall_director
      promotion_owner: overall_director
      founder_lock_owner: founder
      external_action_owner: founder
      may_decide: [route_recommendation, director_promotion, founder_presentation, graph_admission]
      must_not: [secret_exposure, unapproved_external_action, automatic_founder_lock, dual_active_writer, graph_v2_without_switch_receipt]
    return_route:
      recipient_role: founder
