schema_version: idol-instruction-surface-policy.v18
status: active
priority: quality_first_efficiency_second

measurement:
  word_counter: whitespace_words_v1
  target_behavior: warning
  reviewed_ceiling_behavior: error
  size_finding_authority: diagnostic_or_hold_only
  size_remediation_authority: founder_explicit_current_request_only
  automatic_size_remediation: false
  conditional_detail_global_cap: false
  long_section_detail_index_threshold_words: 4000

# Runtime truth is the exact checkpoint load set in the registered profile
# registry. Static startup bundles below remain bootstrap diagnostics only.
runtime_load_measurement:
  registry_path: automation/harness-skill-load-profiles.yaml
  projection_registry_path: automation/harness-role-context-projection.yaml
  receiver_measurement: projected_instruction_content
  target_words: 45000
  reviewed_ceiling_words: 70000
  target_paths: 16
  reviewed_ceiling_paths: 24
  profile_checkpoint_overrides:
    - profile_id: overall_director
      checkpoint_id: director_startup
      target_words: 30000
      reviewed_ceiling_words: 45000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: creative_development_director
      checkpoint_id: cdd_startup
      target_words: 55000
      reviewed_ceiling_words: 70000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: creative_development_director
      checkpoint_id: cdd_direction_alignment
      # Founder-facing whole-direction alignment intentionally combines the
      # professional CDD core with sequence discovery and visual-contract
      # evidence. Keep that quality context and review it against a dedicated
      # target. Founder explicitly preserves the complete read set and approves
      # this checkpoint-only reviewed ceiling instead of deleting context.
      # The 2026-08-24 lift restores Active Output plus the Sequence-parent
      # Core-mark heading in the CDD pack.
      target_words: 60000
      reviewed_ceiling_words: 72800
      target_paths: 18
      reviewed_ceiling_paths: 24
    - profile_id: source_hub_registration
      checkpoint_id: source_registration_and_reusable_analysis
      target_words: 40000
      reviewed_ceiling_words: 55000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: pre_02a_development_block_fp
      checkpoint_id: fp_close_shard
      target_words: 40000
      reviewed_ceiling_words: 55000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: harness_maintenance
      checkpoint_id: instruction_policy_wiki
      target_words: 30000
      reviewed_ceiling_words: 45000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: harness_maintenance
      checkpoint_id: schema_contract_registry
      target_words: 30000
      reviewed_ceiling_words: 45000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: harness_maintenance
      checkpoint_id: skill_profile_routing
      target_words: 30000
      reviewed_ceiling_words: 45000
      target_paths: 16
      reviewed_ceiling_paths: 24
    - profile_id: harness_maintenance
      checkpoint_id: script_validator_registry
      target_words: 30000
      reviewed_ceiling_words: 45000
      # The complete maintenance-only script discovery contract intentionally
      # includes Start Here, the machine registry/schema/checker, searchable
      # INDEX, and all ten bounded role guides. Creative checkpoints never
      # inherit this set.
      target_paths: 20
      reviewed_ceiling_paths: 24
    - profile_id: harness_maintenance
      checkpoint_id: workbench_runtime_ui
      target_words: 30000
      reviewed_ceiling_words: 45000
      target_paths: 16
      reviewed_ceiling_paths: 24

surfaces:
  - id: agents_constitution
    path: AGENTS.md
    role: always_on_constitution
    target_words: 4000
    # Protected invariants keep this above the aspirational target; detailed
    # stage procedure belongs in the conditional policy stack.
    reviewed_ceiling_words: 6400
  - id: production_router
    path: wiki/production-system.md
    role: mandatory_lightweight_router
    target_words: 4000
    reviewed_ceiling_words: 5400
  - id: wiki_index
    path: wiki/INDEX.md
    role: mandatory_index
    target_words: 600
    reviewed_ceiling_words: 900
  - id: active_maintenance
    path: wiki/harness-maintenance-rules.md
    role: conditional_active_rules
    target_words: 1500
    reviewed_ceiling_words: 2600
  - id: repository_readme
    path: README.md
    role: repository_doorway
    target_words: 600
    reviewed_ceiling_words: 900
  - id: policy_index
    path: policies/INDEX.md
    role: conditional_policy_index
    target_words: 600
    reviewed_ceiling_words: 900
  - id: scripts_start_here
    path: scripts/README.md
    role: runtime_script_start_here
    target_words: 600
    reviewed_ceiling_words: 900
  - id: scripts_full_index
    path: scripts/INDEX.md
    role: nonruntime_searchable_script_registry
    target_words: 14000
    reviewed_ceiling_words: 18000

startup_profiles:
  - id: harness_static_startup
    kind: static_bootstrap_diagnostic
    paths:
      - AGENTS.md
      - wiki/production-system.md
      - wiki/INDEX.md
      - README.md
      - policies/INDEX.md
    target_words: 8500
    reviewed_ceiling_words: 9000
  - id: maintenance_static_startup
    kind: static_bootstrap_diagnostic
    paths:
      - AGENTS.md
      - wiki/production-system.md
      - wiki/INDEX.md
      - wiki/harness-maintenance-rules.md
      - README.md
      - policies/INDEX.md
    target_words: 10000
    reviewed_ceiling_words: 11000

