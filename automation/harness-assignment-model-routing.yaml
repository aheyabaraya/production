schema_version: idol-harness-assignment-model-routing.v1
status: grok_default_with_founder_opt_in_substitutes
implementation_baseline: 6d11a1290379d6b7e045c54eebb18681c457484b
selector_policy:
  contains_model_literals: false
  no_fallback: true
  cursor_grok_forbidden: true
  registered_cursor_grok_profile_use: founder_explicit_distinct_cursor_provider_only
  cursor_auto_forbidden: true
  default_medium_forbidden: true
  default_max_forbidden_for:
    - cursor_opus_thinking_high
    - cursor_fable_thinking_xhigh
    - cursor_sol_xhigh
  ultra_forbidden: true
  silent_provider_or_model_substitution: forbidden
  existing_run_snapshots_mutated: false
  default_provider: grok
  default_runtime_surface: grok_cli
  non_grok_requires_founder_explicit_substitute: true
  founder_default_switch_required_for_activation: false
  cdd_grade_resolves_only_to_frontier_director: true
  no_fixed_cdd_count: true
concurrency:
  current_active:
    authoritative_until_atomic_migration: true
    ordinary_combined_creative_workers: 14
    reviewed_maximum_combined_creative_workers: 14
    post_02a_sections_ordinary: 14
    post_02a_sections_reviewed: 14
    grok_nonroot_ordinary: 8
    grok_nonroot_reviewed: 8
    cursor_nonroot_ordinary: 6
    cursor_nonroot_reviewed: 6
    maximum_active_department_sessions: 14
    one_outstanding_media_job_per_section: true
    launch_to_fill_capacity: false
    lower_provider_cap_wins: true
  proposed_future_operational_ceiling:
    status: activated
    ordinary_physical_workers: 14
    hard_safety_ceiling: 14
    ordinary_section_mv_open_all_sections: 7_to_12
    activation: founder_activated_current_request
graph_engineering_director_lanes:
  logical_tier: frontier_director
  compatibility_logical_alias: director_deep
  no_fallback: true
  no_fixed_cdd_count: true
  physical_sessions_per_lane_stage:
    primary: 1
    successor: 1
    maximum: 2
    third_session_action: hold_without_auto_spawn
  overall:
    lane_id_pattern: "^overall$"
  edit_director:
    lane_id_pattern: "^edit_director$"
  planning_cell:
    active_until: g40_handoff_then_readonly
    lanes:
      p1:
        assignment_id: planning_cdd_p1
        lane_id_pattern: "^planning_p1$"
        mode: story_audience_lead
        cardinality: one
        physical_toml: .codex/agents/idol-sol-planning-cdd.toml
        physical_toml_semantics: codex_role_template_only_never_provider_selection
        provider_runtime_profile_id: grok_director_frontier
        return_recipient: overall_director
      p2:
        assignment_id: planning_cdd_p2
        lane_id_pattern: "^planning_p2$"
        mode: visual_reference_development
        cardinality: one
        physical_toml: .codex/agents/idol-sol-planning-cdd.toml
        physical_toml_semantics: codex_role_template_only_never_provider_selection
        provider_runtime_profile_id: grok_director_frontier
        return_recipient: planning_cdd_p1
      p3_ci:
        assignment_id: planning_cdd_p3_ci
        lane_id_pattern: "^planning_p3_c[1-9][0-9]*$"
        mode: section_kinetic_architecture
        cardinality: roster_derived_contiguous_2_or_3_section_cohorts
        no_fixed_count: true
        physical_toml: .codex/agents/idol-sol-planning-cdd.toml
        physical_toml_semantics: codex_role_template_only_never_provider_selection
        provider_runtime_profile_id: grok_director_frontier
        return_recipient: planning_cdd_p1
  section_cluster:
    active_after: g40
    assignment_id: section_cluster_cdd_v_ci
    lane_id_pattern: "^section_cluster_v_c[1-9][0-9]*$"
    cardinality: same_cohort_id_as_matching_p3
    no_fixed_count: true
    physical_toml: .codex/agents/idol-sol-section-cluster-cdd.toml
    physical_toml_semantics: codex_role_template_only_never_provider_selection
    provider_runtime_profile_id: grok_director_frontier
    return_recipient: overall_director
    same_cohort_02b_to_03v_successor: true
  cohort_partition:
    two_or_more_sections: only_2_or_3
    singleton_allowed: whole_title_one_section_only
    capacity_never_creates_cohort: true
    examples:
      - section_count: 4
        cohorts: [2, 2]
      - section_count: 5
        cohorts: [2, 3]
      - section_count: 7
        cohorts: [2, 2, 3]
      - section_count: 8
        cohorts: [2, 3, 3]
      - section_count: 9
        cohorts: [3, 3, 3]
media:
  default_image:
    owner: current_post_02a_section_owner
    provider: grok
    profile_id: grok_worker_high
    tools:
      - image_gen
      - image_edit
    provider_omitted_resolution: current_grok_native_only
    status: default_active_registered_lane
  optional_luna_image:
    provider: cursor
    profile_id: cursor_luna_max
    default_enabled: false
    status: available_founder_explicit_substitute
    requires_cross_provider_transfer: cursor_luna_owner_to_grok_cli_03v_owner
  video:
    provider: grok
    profile_id: grok_worker_high
    tools:
      - image_to_video
      - reference_to_video
    substitution: forbidden
    status: default_active_registered_lane
