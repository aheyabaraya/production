    authorizing_actor: founder
    accepted_evidence: explicit_current_run_route_authorization_or_run_manifest_flag
    applies_to_roles: [creative_development_director, song_room, member_visual_identity_owner, section_owner, edit_director, edit_shard_worker, department_worker]
    department_worker_condition: only_when_assignment_founder_visible_true
    absent_action: hold_without_creation
    authorization_does_not_imply_external_action: true

