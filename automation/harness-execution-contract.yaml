schema_version: idol-harness-execution-contract.v36
status: active

baseline:
  git_commit: d851f4d23356a2695c8c9aa5cef92212f0586334
  initial_final_improvement_attachment_sha256: 3bb54d160022f1c97c2be310292ef51806e2c7b499edb677e861867cb3c1107b
  final_steering_attachment_sha256: 9212636957e87168624a60cc7d4c02344b5655251ca3c6d48e735ab90db0fac1

operating_language:
  repository_and_internal: English
  founder_reply: Founder's apparent language

migration_policy:
  compatibility_branch: none
  historical_named_run_status: closed_outside_active_route
  historical_bytes: evidence_only
  retired_active_artifacts: ["00", "01A", "02"]

objective:
  primary: highest_quality_complete_music_video
  secondary: [token_efficiency, production_speed]
  founder_intervention: normally_pass_hold_reject_only

authority:
  founder: explicit_locks_track_selection_paid_generation_pass_hold_reject_public_release
  overall_director: exactly_one_final_creative_recommendation_and_whole_work_authority
  creative_development_director: one_distinct_durable_founder_visible_pre02a_decision_workbench_lineage_with_one_active_physical_session_reporting_to_overall_director
  song_room: one_physical_founder_visible_song_room_owned_by_cdd_returning_00a_to_cdd
  department_worker: bounded_research_or_pre02a_development_output_only
  member_visual_identity_owner: conditional_physical_current_title_identity_worker_reporting_to_cdd
  section_owner: one_fresh_post02a_section_lineage_through_03v
  mechanical_coordinator: schema_hash_path_exact_copy_and_presence_only
  edit_director: one_separate_04_merge_owner_after_passed_03v_playback_reporting_to_overall
  edit_shard_worker: bounded_physical_04_section_or_connected_chunk_returning_only_to_edit_director

studio_session_routing:
  provider_neutral_roles: [overall_director, creative_development_director, song_room, department_worker, member_visual_identity_owner, section_owner, edit_director, edit_shard_worker, mechanical_coordinator]
  provider_adapters:
    grok:
      provider: grok
      runtime_surface: registered_grok_tui_slash_goal_or_acp_native_goal_session
      provider_adapter_skill_id: grok_harness_owner
      roles: [overall_director, creative_development_director, song_room, department_worker, member_visual_identity_owner, section_owner, edit_director, edit_shard_worker, mechanical_coordinator]
      goal_admission:
        admissible_surfaces: [interactive_tui_slash_goal, acp_matching_native_goal_event]
        interactive_tui_evidence: slash_goal_state_event_matching_dispatch_objective
        acp_evidence: native_goal_id_objective_state_event_matching_dispatch_objective
        matching_objective_required: true
        before_required_reads_or_work: true
        headless_without_matching_native_goal_event: forbidden
        unavailable_status: goal_surface_unavailable
        unavailable_action: hold_with_zero_work_and_zero_output
        work_count_on_unavailable: 0
        output_count_on_unavailable: 0
      lifecycle_operations:
        create: tui_slash_goal_or_acp_native_goal_create
        send: provider_native_send
        wait: provider_native_wait
        resume: provider_native_resume_from_checkpoint
        retire: provider_native_retire_after_closed_checkpoint
        successor: provider_native_successor_from_director_boot_pack_then_registered_router_cas
      same_dispatch_contract_as_cursor: true
      creative_contract_rewrite_allowed: false
    cursor:
      provider: cursor
      runtime_surface: cursor_cli_local_physical_chat
      roles: [overall_director, creative_development_director, department_worker, section_owner, edit_director, mechanical_coordinator]
      same_dispatch_contract_as_grok: true
      creative_contract_rewrite_allowed: false
      alias_to_codex: forbidden
      harness_status: active_with_assignment_holds
      authentication: file_credential_store
      goal_admission: external_goal_record_before_cli_launch
      lifecycle_operations:
        create: cli_first_run
        send: cli_prompt
        wait: cli_terminal_result
        resume: cli_resume_session_id
        cancel: cli_process_cancel
        retire: logical_retire_process_exit
        successor: independent_cli_session_then_registered_router_cas
  provider_may_rewrite_creative_contract: false
  registered_profile_only: true
  silent_fallback_allowed: false
  cross_provider_fallback_allowed: false
  unavailable_profile_action: hold_and_report
  founder_selected_nonmedia_preference:
    provider: grok
    runtime_surface: grok_cli_acp_or_tui
    applies_to: new_nonmedia_director_and_worker_assignments
    excluded_execution_lanes: [02b_image_generation, 03v_video_generation]
    fixed_provider_exceptions:
      founder_briefing_assistant: none
    activation_requires: exact_run_resolved_profile_live_inventory_sandbox_and_readiness
    preference_is_static_active_binding: false
    unavailable_action: hold_without_cross_provider_fallback
  overall_director:
    persistent_sessions: 1
    interaction_surface: founder_visible_stage_room
    founder_visible: true
    durable: true
    allowed_profiles: [standard]
    standing_final_director_allowed: false
    owns_final_recommendation: true
  creative_development_director:
    persistent_sessions: 1
    durable_semantics: decision_and_workbench_lineage
    maximum_active_physical_sessions: 1
    interaction_surface: founder_visible_stage_room
    founder_visible: true
    durable: true
    must_be_distinct_from_overall_director: true
    opens_at: authorized_studio_run_start
    reports_to: overall_director
    becomes_dormant_after: exact_03v_playback_reviewed_milestone
    owns_pre_02a_workers: true
    worker_returns_to: creative_development_director
    wait_mode: event_driven_no_polling
    wake_event_kinds: [final, hold, authority_request, milestone]
    successor_rollover: enabled_fail_closed_provider_neutral_session_router
  song_room:
    persistent_sessions: 1
    interaction_surface: founder_visible_stage_room
    founder_visible: true
    durable: true
    physical_task: true
    created_by: creative_development_director
    reports_to: creative_development_director
    return_package: 00a_package
    route_stages: [pre_00s, candidate_track_analysis, audio_screen_motion_map, song_production_lock, 00a_preparation]
    revision_policy: continue_same_visible_task
  pre_song_departments:
    dispatch_policy: smallest_disjoint_named_gap_assignments_only
    assignment_basis: unresolved_abstract_department_axis
    zero_assignment_when_director_ready: true
    capacity_policy: provider_cap_and_cdd_backpressure_are_ceilings_not_launch_targets
    section_based_dispatch_allowed: false
    return_recipient_role: creative_development_director
    direct_return_to_overall_forbidden: true
  post_song_reference_wave:
    eligible_departments: [reference_research_generalist, world_still_reference_department, pinterest_visual_composition_worker]
    dispatch_policy: smallest_disjoint_named_gap_assignments_only
    assignment_count_policy: floor_six_disjoint_then_named_gap_adaptive
    assignment_count_floor: 6
    floor_omission_action: hold
    floor_skip_requires: closed_not_applicable_reason_per_row
    floor_is_fetch_not_completion_quota: true
    floor_assignments:
      - {department: reference_research_generalist, checkpoint: reference_story_sequence_role, topology: internal_subagent_unless_founder_visible}
      - {department: reference_research_generalist, checkpoint: reference_camera_composition_role, topology: internal_subagent_unless_founder_visible}
      - {department: reference_research_generalist, checkpoint: reference_world_object_material_role, topology: internal_subagent_unless_founder_visible}
      - {department: reference_research_generalist, checkpoint: reference_performance_role, topology: internal_subagent_unless_founder_visible}
      - {department: world_still_reference_department, checkpoint: world_still_physical, topology: physical}
      - {department: pinterest_visual_composition_worker, checkpoint: pinterest_physical, topology: physical}
    generalist_role_routing:
      eligible_checkpoints: [reference_story_sequence_role, reference_camera_composition_role, reference_world_object_material_role, reference_performance_role]
      assignment_basis: cdd_section_function_coverage_matrix_declared_medium_and_current_evidence_gap
      distinct_role_or_section_territory_required: true
      duplicate_assignment_requires: cdd_named_disjoint_section_or_function_gap
      all_role_modules_per_worker: forbidden
      quality_stop: professionally_decision_ready_not_minimum_context
    followup_policy: reuse_existing_owner_or_add_disjoint_assignment_only_for_remaining_named_gap
    source_count_policy: adaptive_to_professional_decision_readiness_no_fixed_source_floor_or_ceiling
    candidate_count_policy: adaptive_to_named_gap_no_fixed_discovery_or_application_quota
    world_still_candidate_policy:
      scope: dispatched_world_space_object_material_functions
      stop_policy: stop_when_professionally_decision_ready_with_nearest_alternative_and_risk
      pinterest_ownership: forbidden_pointer_handoff_only
      raw_pool_quota: none
    pinterest_candidate_policy:
      scope: named_visual_section_major_or_core_gap
      stop_policy: stop_when_professionally_decision_ready_with_nearest_alternative_and_risk
      existing_reference_pool_replacement_allowed: false
      candidate_pool_is_generation_attachment_quota: false
      section_processing: bounded_sequential_batches_in_same_pinterest_lineage
    launch_policy: never_fill_provider_capacity
    queue_policy: provider_cap_cdd_backpressure_owner_path_collision_and_pending_review
    role_return_and_named_gap_reuse_same_sessions: true
    maximum_active_department_sessions: 14
    provider_live_cap: lower_registered_provider_cap
    external_discovery_permission: explicit_per_dispatch
    source_registration_permission: explicit_per_dispatch
    local_registered_source_read: allowed_without_external_permission
    download_capture_or_upload: separate_exact_permission_required
    world_still_video_access: forbidden
    world_still_pinterest_access: forbidden_pointer_handoff_only
    world_still_every_multi_image_comparison: required_hash_bound_uncropped_contact_sheet
    world_still_contact_sheet_before_every_cdd_return: required_hash_bound_uncropped_comparison
    pinterest_video_or_private_access: forbidden
    pinterest_every_section_comparison: required_hash_bound_uncropped_contact_sheet_and_individual_images
    return_recipient_role: creative_development_director
    direct_return_to_overall_forbidden: true
  member_visual_identity:
    route_kind: conditional_physical_current_title_member_visual_identity
    interaction_surface: founder_visible_stage_room
    create_when: required_card_missing_or_new_or_full_restyle_authorized
    do_not_create_when: every_required_current_title_card_is_passed
    physical_task: true
    internal_or_nested_worker_route_allowed: false
    founder_visible: true
    persistent_sessions: 1
    one_member_at_a_time: true
    pinterest_styling_candidate_policy: adaptive_named_component_gap_set_until_professionally_decision_ready
    pinterest_face_identity_use: forbidden
    founder_correction_policy: continue_same_physical_task_with_new_immutable_attempt
    created_by: creative_development_director
    reports_to: creative_development_director
    return_recipient_role: creative_development_director
    direct_return_to_overall_forbidden: true
    passed_card_promotion: cdd_review_overall_presentation_founder_pass_overall_canonical_promotion
  pre_02a_development_wave:
    development_epoch: founder_direction_alignment_then_internal_fp_close_then_role_routed_01_then_02a
    founder_intermediate_refill: forbidden
    internal_checkpoint_review: cdd_single_flight_then_overall_promotion
    fp_close_storyline: exact_hash_bound_preserved_for_02a_final_planning
    early_founder_exception_reasons: [new_or_fully_restyled_member_visual, material_departure_from_aligned_direction, identity_conflict, safety_conflict, source_conflict, feasibility_conflict]
    final_founder_gate: 02a_final_planning
    final_gate_authority: affected_02b_route_only_paid_generation_separate
    total_sessions: {minimum: 2, ordinary_maximum: 4, exception_maximum: 5}
    exception_requires_named_unmergeable_section: true
    section_count_per_block: {minimum: 1, maximum: 3}
    grouped_sections_must_be_connected: true
    separate_section_outputs_required: true
    ordinary_blocks_are_internal: true
    high_touch_block_may_be_founder_visible: true
    maximum_active_department_sessions: 14
    provider_live_cap: lower_registered_provider_cap
    return_recipient_role: creative_development_director
    direct_return_to_overall_forbidden: true
    stage_reuse: same_block_followup_for_fp_close_01_02a

live_worker_capacity:
  ordinary_combined_creative_workers: 14
  reviewed_maximum_combined_creative_workers: 14
  excludes_roles: [overall_director, creative_development_director, edit_director, mechanical_coordinator]
  provider_live_cap_rule: lower_provider_runtime_cap_always_wins
  post_02a_sections: {ordinary_maximum: 14, reviewed_maximum: 14}
  edit_shards: {ordinary_maximum: 4, reviewed_maximum: 6}
  provider_capacity:
    cursor_nonroot: {ordinary_maximum: 6, reviewed_maximum: 6, probe: cursor_cli_active_session_inventory_before_launch}
    grok_nonroot: {ordinary_maximum: 8, reviewed_maximum: 8, probe: native_and_headless_inventory_before_launch}
    ambiguous_state_action: hold_and_report
    launch_to_fill_capacity: false
    queue_when_director_review_pending: true
    queue_launch_when: next_consumes_pending_bytes_or_owner_path_collision

session_route:
  interaction_surface: provider_neutral_internal_or_founder_visible_stage_room
  logical_dispatcher_roles: [overall_director, creative_development_director, edit_director]
  ui_creator_role: root_orchestrator
  return_recipient_roles: [overall_director, creative_development_director, edit_director]
  provider: cursor_or_grok
  runtime_surface: provider_registered_surface
  session_id: required_runtime_field
  parent_session_id: required_nullable_runtime_field
  parent_task_scope: run_or_task_id
  reuse_policies: [followup_same_agent, continue_same_visible_task, fresh_exact_section]
  founder_revision_surface: owning_task_role
  founder_review_board: RUN/review/founder-workbench.html
  department_dispatch_required: true
  director_review_required: true
  director_dispatch_index_required: true
  duplicate_owner_forbidden: true
  founder_briefing_projection:
    assignment: department_worker:founder-briefing
    profile: founder_briefing
    provider: grok
    logical_profile_alias: worker_high
    model_family: grok_high
    founder_visible: true
    source_scope: od_cdd_edit_reviewed_milestones_only
    dispatch_output_kind: founder_briefing_projection
    working_output_path: RUN/work/department-dispatches/outputs/DISPATCH_ID.json
    activation: source_set_digest_change_or_founder_explicit_refresh_never_ui_open
    same_digest_action: display_current_zero_model_turn_zero_write_zero_review_queue
    publication: overall_review_then_mechanical_exact_copy_and_current_refresh
    current_path: RUN/work/founder-briefing/current.json
    immutable_history_path: RUN/work/founder-briefing/history
    canonical_or_creative_authority: none
