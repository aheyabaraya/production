    wake_event_kinds: [final, hold, authority_request, milestone]
    compact_pointer_fields: [output_pointers, aggregate_manifest, hold_or_rejection_pointers, risk_or_unresolved_decision_pointers]
    raw_commentary_in_wake: forbidden
    returned_or_schema_valid_means_creative_pass: false
  visible_task_authorization:
