    physical:
      founder_visible: true
      surface: fresh_assignment_scoped_workbench_visible_session
      cursor: separate_cursor_cli_physical_chat
      grok: separate_native_cli_style_session_projected_like_terminal
    same_contract: [studio_role, model_or_registered_equivalent, effort_and_quality_gate, department_dispatch, native_goal_first, output_owner, return_recipient, director_review, promotion_boundary]
    visibility_changes_authority: false
    worker_creative_grandchildren: forbidden
    split_route: return_exact_unowned_subscopes_to_parent_director_for_sibling_dispatch
    ordinary_worker_may_use_parent_scoped_helpers: true
    parent_scoped_helpers:
      grok_tool: spawn_subagent
      not_a_physical_session: true
      cdd_fp_02a_multi_leaf_min: 4
      exact_byte_return_review_min: 0
      below_min_action: helper_floor_unmet_hold
  session_and_helper_operating_lock:
    authority: automation/harness-execution-contract.yaml
    physical_session_is_not_a_subagent: true
    image_section_worker: physical_post_02a_session
    cdd_dispatch_and_review: parent_scoped_spawn_subagent_min_4
    ordinary_02a_block: internal_subagent_min_4
    high_touch_02a: one_founder_visible_terminal_optional
    overall_assigns_checkpoint_not_a_new_cdd: true
    cdd_dormant_after_03v_playback_milestone: true
    edit_opens_edit_director_not_cdd: true
  intermediate_videoization: forbidden_all_02a_major_core_and_other_mid_pipeline
  compiled_launch_prompt:
    derivation: studio_kernel_plus_exact_role_context_pack_plus_current_run_creative_delta
    profile_registry: automation/harness-skill-load-profiles.yaml
    reusable_fixed_creative_prompt: forbidden
    first_runtime_action: open_native_goal_from_goal_contract_then_validate_role_context_pack_before_work
    block_order:
      - dispatch_identity
      - role_and_authority
      - current_creative_job
      - exact_scope_and_non_scope
      - input_pointers
      - skill_route
      - required_work
      - output_contract
      - quality_proof
      - return_ready_conditions
      - hold_stop_split_conditions
      - return_and_wake
    current_run_creative_delta_required_values: [founder_verbatim_and_explicit_locks, locked_target_and_audience_reward, selected_song_or_audio_cue, whole_film_and_assigned_section_content_role, current_screen_or_reference_gap]
    reference_work_delta_required_values: [source_discovery_mode, named_current_gap, source_eligibility_or_exact_permission_pointer]
    script_assembly: fixed_labels_and_exact_copy_only
    script_may_author_infer_summarize_or_repair_creative_truth: false
    hash_bindings: [studio_kernel, selected_profile_checkpoint, profile_registry, role_context_pack, role_context_source_set, current_run_creative_delta_sources, goal_contract, requirement_manifest, compiled_input, rendered_prompt]
  startup_admission:
    schema: schemas/harness-startup-admission.schema.json
    packet_schema_version: idol-harness-startup-admission.v2
    compiler: scripts/idol_startup_admission.rb
    workbench_bridge: run.compileStartupAdmission
    trigger: explicit_current_run_start_or_resume_or_registered_route_authorization
    placement: before_first_overall_model_turn_inside_existing_session_route
    creates_stage: false
    creates_approval_gate: false
    preserves_existing_stage_order_and_authority: true
    current_run_binding: [run_root, run_manifest, plan, canvas, founder_epoch, active_owner_role]
    profile_registry: automation/harness-skill-load-profiles.yaml
    profile_registry_sha256_required: true
    runtime_instruction_input: idol-role-context-pack.v1
    broad_profile_reads_are_runtime_additive: false
    role_context_receipt_required: true
    transient_only: true
    persistence_scope: run_owned_or_workbench_artifact
    persisted_prompt_or_founder_message: false
    overall:
      profile_id: overall_director
      checkpoint_id: director_startup
      first_turn: startup_read_gate
      founder_message: exact_verbatim_live_memory_only
      current_run_pointers: exact_copy_with_sha256
      stale_or_missing_action: hold_before_model_turn
      delta_author: overall_director_model_only
      machine_delta_authoring_summarizing_or_repair: forbidden
      compiled_launch_continuation: second_turn_same_physical_overall_session
    creative_development_director:
      route_author: overall_director_model_only
      profile_id: creative_development_director
      checkpoint_id: cdd_startup
      launch: only_after_valid_overall_typed_route
      startup_delta_author: overall_director_model_only
      role_context_receipt_return_required: true
      worker_launch_before_return: forbidden
      no_route_behavior: continue_with_overall_without_cdd_or_worker_launch
    lifecycle_projection: existing_canvas_session_links_only
    downstream_dispatch: existing_department_dispatch_v8_goal_compliance_review_submission_cap_and_single_flight
    paid_external_or_public_action_authorized: false
  event_wait_and_wake:
