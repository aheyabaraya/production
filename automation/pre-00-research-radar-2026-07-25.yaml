  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 3
  reference_families: [song, media_narrative, fashion, idol]
  unit_registry: "assets/unit-registry.yaml"
  reference_depth_goal: "Three materially different routes; each uses one source from every required family and an active registered unit."
  combination_rule: "Song feeling, story pressure, styling behavior, and AURORA-M unit ownership must produce one screen mechanism; no source is a decorative mood tag."
  unity_rule: "Each route names a coherent tone, audience receive, object/world action, and one visible hook without treating any proposal as a lock."
  ref_id_integrity_rule: "Use unique family-prefixed IDs; lane_ref_ids may only point to their matching reference family."
  allowed_output: "scoped_route_candidate_brief_before_00"
  handoff_target: "00_creative_nucleus_draft_after_founder_selection_and_concrete_song_support"
  public_reference_mining_policy:
    status: "public_web_only_no_media_capture"
    account_boundary: "No private connectors, login, cookies, downloads, uploads, paid APIs, or publication."
    note: "No Bilibili or yt-dlp mining was used in this pass."
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#Freshness Windows"
  recheck_before_00: "Recheck the 2026-07-01-to-14 pulse and all release-dependent web sources if selection occurs after 2026-08-08 or if a new weekly short-form report changes the platform read."
  durable_record_rule: "Keep this automation artifact as short-term route support; promote only founder-selected and review-proven material."
  bank_record_rule: "Message-hook bank checked before authoring; these three semantic combinations do not match the existing root-signal, collar-exit, pocket-tap, or dissonance cards."
research_vectors:
  - vector_id: "V01_TREND_HYPOTHESIS_FIT"
    research_question: "How can the active bright-proof-under-pressure pulse avoid both empty summer nostalgia and hard-club imitation?"
    sample_rule: "Use the active pulse plus current July release reporting; record only a transferable function, not an asserted audio analysis."
    extraction_fields: ["song feeling", "message pressure", "first image", "avoid rule"]
    downstream_targets:
      - {stage: "PRE-00", artifact_or_schema: "schemas/pre-00-research-radar.schema.json", field_path: "candidate_routes[].combined_signal", handoff_use: "Keep each route's timely pressure concrete."}
    reject_if_missing: "Reject a route whose bright surface has no private cost or visible proof."
  - vector_id: "V02_TARGET_EMPATHY_MESSAGE"
    research_question: "Which small adult pressure can a global K-pop viewer recognize without reducing the MV to generic empowerment?"
    sample_rule: "Choose a specific stalled action—service, recording, or carrying a receipt—and name the misread risk."
    extraction_fields: ["viewer situation", "identification point", "aftertaste", "message translation"]
    downstream_targets:
      - {stage: "PRE-00", artifact_or_schema: "schemas/pre-00-research-radar.schema.json", field_path: "candidate_routes[].recommended_00_draft.target_empathy_seed", handoff_use: "Preserve the audience receive for a later selected draft."}
    reject_if_missing: "Reject slogans with no viewer situation or body/object consequence."
  - vector_id: "V03_WARDROBE_MATERIAL_MOTION"
    research_question: "How can FW26 tailoring and textured color function as movement evidence instead of costume decoration?"
    sample_rule: "Use one softened structured base and one mobile accent; keep all styling contemporary and performance-safe."
    extraction_fields: ["silhouette", "accent", "movement behavior", "over-style risk"]
    downstream_targets:
      - {stage: "01", artifact_or_schema: "01 director chain", field_path: "wardrobe_read", handoff_use: "Convert the selected silhouette into a section-specific wardrobe decision later."}
    reject_if_missing: "Reject routes in which the fabric has no action or identity job."
