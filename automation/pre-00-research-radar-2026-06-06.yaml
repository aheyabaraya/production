research_vectors:
  - vector_id: trend_hypothesis_fit
    research_question: "Does the June harder-club hypothesis still produce the clearest IDOL route, or is the usable edge now pressure plus one explicit human stake?"
    sample_rule: "Use the active monthly record, one fresh current-song signal, and one fresh current-media signal before writing route bias."
    extraction_fields:
      - "current pressure lane"
      - "save-trigger evidence"
      - "human-stake proof"
      - "route-level contradiction"
    downstream_targets:
      - stage: pre00_research_input
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: research_freshness.recheck_before_00
        handoff_use: "Keeps the route tied to current June signals rather than stale May-only assumptions."
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].recommended_00_draft.thesis.message
        handoff_use: "Forces each 00 seed to keep the pressure lane human-readable."
    reject_if_missing: "Hold the pass if the route cannot name why June pressure matters to a real viewer."
  - vector_id: song_hook_structure
    research_question: "Which current song references prove the best first 15s save trigger, pre-hook addiction engine, and repeatable post-hook body phrase?"
    sample_rule: "Use public song references plus the current local draft-track fit note before naming any route-level song structure seed."
    extraction_fields:
      - "first 3-8s signal"
      - "pre-hook lift"
      - "post-hook body proof"
      - "target pulse family"
    downstream_targets:
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].recommended_00_draft.song_structure_seed
        handoff_use: "Gives 00 a usable first-section architecture without inventing the hook mechanic later."
      - stage: pre00s_reference_song_fit
        artifact_or_schema: schemas/reference-song-fit.schema.json
        field_path: tempo_lyric_density_fit.target_translation
        handoff_use: "Lets the founder move from route selection into prompt shaping without redoing the sound-anchor read."
    reject_if_missing: "Do not advance a route if the first 15s and post-hook proof are both vague."
  - vector_id: target_empathy_message
    research_question: "What exact viewer situation, pressure, or secret makes the route feel ownable instead of merely stylish?"
    sample_rule: "Each route must translate one public narrative or emotional premise into a concrete IDOL audience lock."
    extraction_fields:
      - "target viewer"
      - "identification point"
      - "aftertaste"
      - "message risk"
    downstream_targets:
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].recommended_00_draft.target_empathy_seed
        handoff_use: "Fills the required audience lock for a later 00 draft."
      - stage: 00_creative_nucleus
        artifact_or_schema: schemas/00-creative-nucleus.schema.json
        field_path: target_empathy_lock
        handoff_use: "Prevents 00 from drifting into concept gloss without audience ownership."
    reject_if_missing: "Reject any route whose message can be restated only as generic confidence or vague heartbreak."
  - vector_id: wardrobe_material_motion
    research_question: "Which current SS26 materials and silhouettes add visible motion proof without breaking member readability?"
    sample_rule: "Use one seasonal fashion rail plus one fresh June-facing styling signal for each wardrobe-heavy route."
    extraction_fields:
      - "silhouette"
      - "material motion"
      - "cue color"
      - "body proportion risk"
    downstream_targets:
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].recommended_00_draft.visual_world_seed.wardrobe_lane
        handoff_use: "Lets 00 preserve the right styling lane before 01A refines it."
      - stage: 01a_track_visual_board
        artifact_or_schema: schemas/track-visual-board.schema.json
        field_path: wardrobe_board
        handoff_use: "Narrows later wardrobe boards to performance-safe contemporary rails."
    reject_if_missing: "Do not treat vague 'fashionable' notes as enough; the route needs material behavior and silhouette logic."
  - vector_id: unit_member_identity_fit
    research_question: "Which active unit can own the route without forcing FULL_CODE or fighting the member voice/performance rails?"
    sample_rule: "Use only active units from `assets/unit-registry.yaml` and member-role rails from `assets/voice-style-index.md`."
    extraction_fields:
      - "unit ownership"
      - "member bridge"
      - "center-role need"
      - "unit risk"
    downstream_targets:
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].recommended_00_draft.asset_alignment_seed
        handoff_use: "Preloads 00 with a defendable unit choice and identity constraint."
      - stage: pre00s_reference_song_fit
        artifact_or_schema: schemas/reference-song-fit.schema.json
        field_path: unit_fit
        handoff_use: "Aligns sound-anchor analysis with the route's actual performance owner."
    reject_if_missing: "Reject any route whose best-fit unit cannot be named with a concrete reason."
  - vector_id: source_diversity_raw_trace
    research_question: "Can each route show distinct song, media, fashion, and idol families without collapsing into one borrowed reference?"
    sample_rule: "Every candidate route must cite at least one ref from each family and one route-level mismatch watch."
    extraction_fields:
      - "lane coverage"
      - "raw source trace"
      - "overlap risk"
      - "downstream handoff trace"
    downstream_targets:
      - stage: pre00_research_input
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].source_ref_ids
        handoff_use: "Keeps later founder review and 00 drafting auditable."
      - stage: 02a_master_storyboard
        artifact_or_schema: schemas/02a-master-storyboard.schema.json
        field_path: compile_seed.source_refs
        handoff_use: "Preserves source trace when a chosen route later becomes beat-level visual work."
    reject_if_missing: "Do not keep two routes that share nearly the same function stack with only cosmetic wording changes."
