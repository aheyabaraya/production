schema_version: "1.2"
radar_id: PRE00_RESEARCH_RADAR_2026_06_06
date: "2026-06-06"
mode: automation
status: founder_review
research_policy:
  method_basis: "AGENTS.md + wiki/production-system.md + wiki/pre-00-song-system.md + automation/pre-00-research-radar.md + skills/idol-research-radar/SKILL.md"
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families:
    - song
    - media_narrative
    - fashion
    - idol
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Use the active June monthly hypothesis, current SS26 styling rails, fresh public music/media signals, and one current local sound-anchor note that can be reviewed as a paired PRE-00S companion."
  combination_rule: "Every route must combine at least one song, one media narrative, one fashion, and one idol reference into a new IDOL thesis rather than decorating one dominant source."
  unity_rule: "Tone, mood, and message must read as one route across the four families before the founder sees it."
  ref_id_integrity_rule: "Use keyed family ids once; do not double-count one source as multiple families."
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#Freshness Windows"
  recheck_before_00:
    - "Recheck current-run public web references if founder selection happens after 2026-06-20."
    - "Recheck public idol promotion signals if a chosen route waits more than 2-4 weeks before 00."
    - "Keep `source-materials/monthly-trend-records/2026-06.md` and `source-materials/fashion-trend-records/2026-ss.md` as hypotheses; current-run source evidence overrides them when they conflict."
  durable_record_rule: "Do not promote ordinary radar findings into durable source material without founder selection or repeated reuse."
  bank_record_rule: "Avoid semantic overlap with 2026-05-24 message-hook records unless the message function and body mechanic materially change."
