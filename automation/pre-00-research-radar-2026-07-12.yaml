    why_aurora_m_can_own_it: "AURORA-M can make public polish feel human by letting active member roles prove the value conflict instead of only decorating it."
    risk_or_gap: "Needs PRE-00S song-reference selection before a prompt so hard public pressure does not erase the emotional refusal."
