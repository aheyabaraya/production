      - {stage: pre00s_reference_song_fit, artifact_or_schema: schemas/reference-song-fit.schema.json, field_path: "function_breakdown[].wanted_function", handoff_use: "Measure whether the selected hard-bright reference can carry a first-stamp hook plus pre-hook refusal."}
