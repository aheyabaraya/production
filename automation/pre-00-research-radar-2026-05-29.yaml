    - "Recheck public idol promotion signals if a route stays unselected for more than 2-4 weeks."
    - "Keep the active monthly and SS26 fashion records as hypotheses; current-run web signals override them when they conflict."
  durable_record_rule: "Do not promote ordinary radar findings into durable source material without founder selection or repeated reuse."
  bank_record_rule: "Avoid semantic overlap with 2026-05-24 message-hook records unless the message function and body mechanic materially change."
