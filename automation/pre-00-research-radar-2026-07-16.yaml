schema_version: "1.2"
radar_id: PRE00_RESEARCH_RADAR_2026_07_16
date: "2026-07-16"
mode: automation
status: founder_review
research_policy:
  method_basis: "AGENTS.md + wiki/production-system.md + wiki/pre-00-song-system.md + automation/pre-00-research-radar.md + skills/idol-research-radar/SKILL.md + research-radar-authoring-detail.md"
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families: [song, media_narrative, fashion, idol]
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Compact paired PRE-00/PRE-00S discovery using the active July pulse, SS26 fashion rail, public web checks on 2026-07-16 KST, and active member/unit/voice assets."
  combination_rule: "Every route combines song, media_narrative, fashion, and idol support into one new IDOL route; no route is one source with decorations."
  unity_rule: "Tone, mood, message, object hook, and unit ownership must cohere before founder selection."
  ref_id_integrity_rule: "Use keyed family IDs once and keep song, media_narrative, fashion, and idol lanes separate."
  allowed_output: scoped_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#Freshness Windows"
  recheck_before_00:
    - "Recheck public web references if founder selection happens after 2026-07-30."
    - "Recheck short-lived idol, chart, platform, and fashion-current claims before 00 if the chosen route waits more than 2-4 weeks."
    - "The weekly idol and short-form reports are still TBD/not_started in this repository, so current-run public checks were used only as bounded support."
  durable_record_rule: "Do not promote ordinary radar findings into source-materials or reference-library until founder selection or repeated run validation."
  bank_record_rule: "Checked creative-bank/message-hooks; today avoids repeating the May and July value-tag, board-game, mirror, scarf-receipt, and band-last-light routes as renamed cards."
research_vectors:
  - vector_id: trend_hypothesis_fit
    research_question: "Which current public signals refresh July's bright-proof-under-pressure bias without repeating the 2026-07-12 route set?"
    sample_rule: "Use active July pulse plus public song/idol/media/fashion checks; reject unsupported demographic or chart claims."
    extraction_fields: ["current signal", "counter-signal", "first-15s proof", "route risk"]
    downstream_targets:
      - {stage: pre00_recommended_00_draft, artifact_or_schema: schemas/pre-00-research-radar.schema.json, field_path: "candidate_routes[].combined_signal", handoff_use: "State why the route is timely enough to expand."}
    reject_if_missing: "Reject if the route only renames a prior July card."
  - vector_id: song_hook_structure
    research_question: "Which song surface gives a 3-8s entry tag, pre-hook reason, and chorus/body object before 00?"
    sample_rule: "Extract functions from hard public club pressure, hyperpop club gesture, dance-unity percussion, narrative pop anthem, and melodic risk heat."
    extraction_fields: ["entry tag", "pre-hook reason", "chorus proof", "memory tag"]
    downstream_targets:
      - {stage: pre00s_reference_song_fit, artifact_or_schema: schemas/reference-song-fit.schema.json, field_path: "function_breakdown[].prompt_translation", handoff_use: "Guide PRE-00S only if founder selects a song-led route or supplies exact references."}
    reject_if_missing: "Reject if only genre is named and no section function exists."
  - vector_id: target_empathy_message
    research_question: "What can a global K-pop fan receive as self-image rather than only admire as styling or power?"
    sample_rule: "Every route names viewer state, identification point, aftertaste, and mismatch risk."
    extraction_fields: ["viewer state", "identification point", "aftertaste", "risk"]
    downstream_targets:
      - {stage: 00_creative_nucleus, artifact_or_schema: schemas/creative-nucleus.schema.json, field_path: target_empathy_lock, handoff_use: "Seed future 00 target empathy after founder selection."}
    reject_if_missing: "Reject if the route is only concept gloss with no human stake."
  - vector_id: mv_world_storyline
    research_question: "Which visible world, object, or system can carry the message before choreography and 02A cuts are written?"
    sample_rule: "Use media narrative references as screen-function sources, not plot-copy commands."
    extraction_fields: ["space", "object", "turn", "camera cue"]
    downstream_targets:
      - {stage: 01_song_choreography_performance_mv_map, artifact_or_schema: 01-song-choreography-performance-mv-map.yaml, field_path: director_chain.space_or_object, handoff_use: "Keep a concrete world/object carrier for later 01 expansion."}
    reject_if_missing: "Reject if no frameable object, room, or transition system exists."
  - vector_id: wardrobe_material_motion
    research_question: "Which SS26/current styling rails create visible movement or identity without period-costume drift?"
    sample_rule: "Use fashion-season records plus public fashion pages; keep styling as motion/support, not narrative proof."
    extraction_fields: ["silhouette", "material", "accessory cue", "body-proportion risk"]
    downstream_targets:
      - {stage: 01a_track_visual_board, artifact_or_schema: schemas/track-visual-board.schema.json, field_path: wardrobe_locks, handoff_use: "Seed 01A wardrobe/material locks only after founder selection."}
    reject_if_missing: "Reject if styling is decorative and cannot help action, camera, or member identity."
  - vector_id: unit_member_identity_fit
    research_question: "Which active code-style unit owns the route without retired unit names?"
    sample_rule: "Use assets/unit-registry.yaml, assets/member-registry.yaml, and assets/voice-style-index.md."
    extraction_fields: ["unit purpose", "member role", "center risk", "voice/performance fit"]
    downstream_targets:
      - {stage: pre00_recommended_00_draft, artifact_or_schema: schemas/pre-00-research-radar.schema.json, field_path: "candidate_routes[].recommended_unit", handoff_use: "Keep active unit and member focus explicit for founder selection."}
    reject_if_missing: "Reject if the route needs an ad hoc or retired unit."
