schema_version: "1.2"
radar_id: PRE00_RESEARCH_RADAR_2026_06_30
date: "2026-06-30"
mode: automation
status: founder_review
research_policy:
  method_basis: "AGENTS.md + wiki/production-system.md + wiki/pre-00-song-system.md + automation/pre-00-research-radar.md + skills/idol-research-radar/SKILL.md"
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families:
    - song
    - media_narrative
    - fashion
    - idol
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Compact PRE-00 discovery using current public web checks, the active June trend record, SS26 fashion rails, local member/unit/voice assets, and the existing 0610 reference-song fit as paired PRE-00S context only."
  combination_rule: "Every route combines song, media narrative, fashion, and idol support into one new IDOL route; no route is only a decorated copy of one source."
  unity_rule: "Tone, mood, and message must agree before founder selection: song pressure, viewer emotion, styling motion, and unit ownership should feel like one MV seed."
  ref_id_integrity_rule: "Use keyed family IDs once and keep song, media_narrative, fashion, and idol lanes separate."
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#Freshness Windows"
  recheck_before_00:
    - "Recheck public web references if founder selection happens after 2026-07-14."
    - "Recheck short-lived idol promotion signals before 00 if a chosen route waits more than 2-4 weeks."
    - "Treat source-materials/monthly-trend-records/2026-06.md and source-materials/fashion-trend-records/2026-ss.md as working hypotheses, not locks."
  durable_record_rule: "Do not promote ordinary radar findings into source-materials or reference-library until founder selection or repeated run validation."
  bank_record_rule: "Checked creative-bank/message-hooks for prior root-signal, exit, pact, band-commit, and full-code boot lanes; today routes avoid repeating those semantic hooks unless the founder combines them intentionally."
research_vectors:
  - vector_id: trend_hypothesis_fit
    research_question: "Which June public signals still support hard club pressure, and where is the countertrend toward bright summer-pop useful?"
    sample_rule: "Use current public music/fashion pages plus the active monthly record; reject stale chart claims as locks."
    extraction_fields: ["current signal", "counter-signal", "route risk", "song pressure"]
    downstream_targets:
      - stage: pre00_recommended_00_draft
        artifact_or_schema: schemas/pre-00-research-radar.schema.json
        field_path: candidate_routes[].combined_signal
        handoff_use: "State why the route is timely enough to expand."
    reject_if_missing: "Reject if no current signal changes the route beyond prior June radar cards."
  - vector_id: song_hook_structure
    research_question: "What first-15s song behavior can become a save trigger before the full MV exists?"
    sample_rule: "Extract hook mechanics from public K-pop trend coverage, active monthly structure, and 0610 PRE-00S fit context."
    extraction_fields: ["first signal", "pre-hook lift", "chorus proof", "memory tag"]
    downstream_targets:
      - stage: pre00s_reference_song_fit
        artifact_or_schema: schemas/reference-song-fit.schema.json
        field_path: function_breakdown[].prompt_translation
        handoff_use: "Guide PRE-00S if founder selects a song-led route."
    reject_if_missing: "Reject if the route only names a genre and no section function."
  - vector_id: target_empathy_message
    research_question: "What can a global K-pop fan receive as their own feeling, not just admire as styling?"
    sample_rule: "Every route must name a viewer situation and a one-sentence message."
    extraction_fields: ["viewer state", "identification point", "aftertaste", "mismatch risk"]
    downstream_targets:
      - stage: 00_creative_nucleus
        artifact_or_schema: schemas/creative-nucleus.schema.json
        field_path: target_empathy_lock
        handoff_use: "Seed the future 00 target-empathy decision after founder selection."
    reject_if_missing: "Reject if the route is only concept gloss with no human stake."
  - vector_id: mv_world_storyline
    research_question: "Which visible world/object system can carry the message before choreography details are written?"
    sample_rule: "Use current media narrative references as screen-function sources, not as plot-copy commands."
    extraction_fields: ["space", "object", "turn", "camera cue"]
    downstream_targets:
      - stage: 01_song_choreography_performance_mv_map
        artifact_or_schema: 01-song-choreography-performance-mv-map.yaml
        field_path: director_chain.space_or_object
        handoff_use: "Keep a concrete world/object carrier for later 01 expansion."
    reject_if_missing: "Reject if no frameable object, room, or transition system exists."
  - vector_id: wardrobe_material_motion
    research_question: "Which SS26 styling rails create visible movement or identity without period-costume drift?"
    sample_rule: "Use fashion-season records plus current public fashion pages; keep styling as a motion/support lane."
    extraction_fields: ["silhouette", "material", "accessory cue", "body-proportion risk"]
    downstream_targets:
      - stage: 01a_track_visual_board
        artifact_or_schema: schemas/track-visual-board.schema.json
        field_path: wardrobe_locks
        handoff_use: "Seed 01A wardrobe/material locks only after founder selection."
    reject_if_missing: "Reject if styling is decorative and cannot help action, camera, or member identity."
