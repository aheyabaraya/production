  ref_id_integrity_rule: "Reference IDs stay family-scoped and each route cites only the refs it actually uses."
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#freshness-windows"
  recheck_before_00:
    - "Recheck current-run web research if selection happens more than 14 days later or if the source is release/news dependent."
    - "Recheck public idol/pop promotion signals within 2-4 weeks before 00."
    - "Recheck fashion-season support after season change, after roughly 8-12 weeks, or when a route depends on a newly visible runway/editorial shift."
  durable_record_rule: "Promote only founder-selected, review-proven, or repeatedly useful references into durable source material or reference-library."
  bank_record_rule: "Record message functions, hook mechanics, and message-hook combinations in creative-bank/message-hooks before reuse."
