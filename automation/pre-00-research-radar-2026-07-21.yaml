schema_version: "1.2"
radar_id: PRE00_RADAR_2026_07_21
date: "2026-07-21"
mode: automation
status: founder_review
research_policy:
  method_basis: "idol-research-radar full structured route; public web research plus current local trend, fashion, member, and unit records"
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 3
  reference_families: [song, media_narrative, fashion, idol]
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "One distinct usable function per family; keep weak current-idol claims out until the weekly bundle exists."
  combination_rule: "Every route cites all four families and changes the listener situation, body hook, unit, and screen system rather than merely recoloring one idea."
  unity_rule: "Song pulse, narrative pressure, wardrobe motion, and member proof must make the same emotional claim."
  ref_id_integrity_rule: "source_ref_ids and lane_ref_ids resolve only to keyed research_inputs in their matching family."
  allowed_output: scoped_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md freshness windows"
  recheck_before_00:
    - "Refresh the July pulse and check the missing weekly idol and short-form reports before route selection is promoted after 2026-08-04."
    - "Recheck public promotion or platform claims; none are asserted as current evidence here."
  durable_record_rule: "This automation artifact is short-term route support, not a durable reference promotion."
  bank_record_rule: "Search found no matching selected hook record; do not add a message-hook bank entry until founder selection or a test."
research_inputs:
  REF_SONG_BRIGHT_PROOF_PULSE:
    title: "2026-07 Pulse 01: pressure-bright / summer-recall song map"
    path_or_url: source-materials/trend-pulse-records/2026-07-pulse-01.md
    reference_family: song
    reference_lane: song_structure
    short_note: "Calls for a 3-8 second identity signal, pre-hook emotional reason, and crop-safe post-hook body proof."
    useful_function: "Use a bright surface over a pressure engine; do not use generic empowerment or challenge-only construction."
    collection_method: trend_record
    source_use_boundary: "Working local hypothesis; recheck before 00 if selection is delayed."
  REF_MEDIA_NARRATIVE_TREASURE_EVERYTHING:
    title: "YG LIFE: TREASURE 'EVERYTHING' MV"
    path_or_url: https://yg-life.com/archives/194905?lang=en
    reference_family: media_narrative
    reference_lane: character_arc
    short_note: "Official label account describes a refreshing coming-of-age love story grounded in friendship and support."
    useful_function: "Let a polished performance world contain a concrete relationship turn rather than treating warmth as a decorative mood."
    collection_method: published_article
    source_use_boundary: "Narrative-function reference only; no scene, identity, or visual copying."
  REF_MEDIA_NARRATIVE_KPDH_MUSIC_STORY:
    title: "TIME: KPop Demon Hunters breakthrough profile"
    path_or_url: https://time.com/7338690/breakthrough-of-the-year-2025-kpop-demon-hunters/
    reference_family: media_narrative
    reference_lane: concept_semantics
    short_note: "The profile attributes the soundtrack's resonance to music being woven into story."
    useful_function: "Give the hook a visible story consequence, not only a lore label or visual effect."
    collection_method: published_article
    source_use_boundary: "Concept-semantics reference only; no character, world, or plot extraction."
  REF_FASHION_SS26_UTILITY_SCARF:
    title: "Vogue: Spring 2026 trend report"
    path_or_url: https://www.vogue.com/article/the-spring-2026-trend-report-a-season-of-uniform-dressing-rococo-flourishes-and-much-more
    reference_family: fashion
    reference_lane: accessory_styling
    short_note: "Reports a remix season with utility dressing and scarf-knot gestures."
    useful_function: "Use a single motivated scarf or utility layer as a hand-and-airflow cue, never as random decoration."
    collection_method: published_article
    source_use_boundary: "Wardrobe and accessory function only; it cannot supply story or choreography."
  REF_FASHION_SS26_SATIN_COLOR:
    title: "Vogue: 15 Spring 2026 trends"
    path_or_url: https://www.vogue.com/article/fall-styling-spring-2026-trends
    reference_family: fashion
    reference_lane: color_palette
    short_note: "Names utility jackets, silk scarves, draped satin, and high-contrast crimson/electric-blue/violet color."
    useful_function: "Pair one practical base with one liquid or saturated cue layer so brightness reads as a decision."
    collection_method: published_article
    source_use_boundary: "Seasonal styling evidence only; match to member identity before a later visual lock."
  REF_IDOL_UNIT_REGISTRY:
    title: "AURORA-M active unit registry"
    path_or_url: assets/unit-registry.yaml
    reference_family: idol
    reference_lane: idol_identity
    short_note: "Defines active units, member lists, center roles, and distinct route risks."
    useful_function: "Use only active units and their actual member sets; do not infer a full-roster route from scale alone."
    collection_method: local_asset
    source_use_boundary: "Internal identity and ownership evidence; not a claim about a current external idol promotion."
  REF_IDOL_POINT_CHOREO:
    title: "Marie Claire: KATSEYE choreography directors interview"
    path_or_url: https://www.marieclaire.com/culture/music/katseye-performance-directors-grant-gilmore-sohey-sugihara-interview/
    reference_family: idol
    reference_lane: idol_performance
    short_note: "Describes point choreography as a recognizable, replicable chorus move and links it to covers and performance versions."
    useful_function: "Make one gesture legible in a front or three-quarter phone crop, while retaining a full-song performance reason."
    collection_method: published_article
    source_use_boundary: "Performance-readability evidence only; do not copy a named choreography."
research_vectors:
  - vector_id: trend_hypothesis_fit
    research_question: "Can the bright-proof hypothesis remain human rather than nostalgia or club imitation?"
    sample_rule: "Use the active local pulse and one current public narrative source; mark missing weekly evidence as a recheck rather than fill it with claims."
    extraction_fields: [listener tension, first-15-second reason, reference-application scope]
    downstream_targets:
      - {stage: pre00_recommended_00_draft, artifact_or_schema: "00-creative-nucleus.yaml", field_path: target_empathy_seed, handoff_use: "Founder-selected audience hypothesis."}
    reject_if_missing: "Reject any route whose brightness has no observable pressure or human stake."
  - vector_id: song_hook_structure
    research_question: "Which entry, lift, and body response can make a future reference-song fit specific?"
    sample_rule: "Use the pulse only as a function family until the founder supplies a song and timestamps."
    extraction_fields: [entry signal, pre-hook lift, post-hook body proof]
    downstream_targets:
      - {stage: pre00s_reference_song_fit, artifact_or_schema: "reference-song-fit.schema.json", field_path: function_breakdown, handoff_use: "Compare only after founder supplies a sound anchor."}
    reject_if_missing: "Reject prompt-ready claims without founder-provided reference audio."
  - vector_id: wardrobe_material_motion
    research_question: "Which SS26 layer moves with the body and remains performance-safe?"
    sample_rule: "Use fashion only for silhouette, material, color, or accessory role."
    extraction_fields: [base layer, motion accent, color limit]
    downstream_targets:
      - {stage: 01a_track_visual_board, artifact_or_schema: "01A visual board", field_path: wardrobe_motion, handoff_use: "Later visual-lock candidate, not a lock now."}
    reject_if_missing: "Reject costume-first routes without a choreography function."
