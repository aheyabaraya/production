schema_version: "1.3"
radar_id: RADAR_20260802
date: "2026-08-02"
mode: automation
status: founder_review

research_policy:
  method_basis: "Founder-approved public-web research plus the active local pulse, W29 weekly idol bundle, SS26 fashion record, and active member/unit/voice summaries."
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 4
  reference_families: [song, media_narrative, fashion, idol]
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Four materially different routes, each with separate sound, narrative, fashion, and idol functions rather than a trend collage."
  combination_rule: "Every route must turn one song question, one observable situation, one wearable material action, and one active-unit function into the same viewer reward."
  unity_rule: "tone_mood_message_unity, target_empathy_seed, storyline_spine_seed, and recommended_00_seed are carried as explicitly labelled question-only seeds inside each route_seed; they are not later-stage truth."
  ref_id_integrity_rule: "Every family-prefixed id resolves once; each lane_ref_ids entry is a matching-family subset of source_ref_ids."
  allowed_output: scoped_route_candidate_brief_before_song_selection
  handoff_target: song_direction_and_candidate_audio_path

research_freshness:
  policy_ref: "automation/pre-00-research-radar.md; the active 2026-07-01-to-14 pulse remains a working hypothesis and W29 remains the latest completed weekly idol bundle."
  recheck_before_song_selection:
    - "Recheck dated public release pages and the active biweekly pulse at selection time."
    - "Do not make a TikTok/Instagram behavior claim until an active weekly short-form report exists."
    - "Use the existing 2026-07-28 founder reference-song-fit records only if the Founder explicitly selects that song lane; otherwise supply a route-specific song, section, timestamp, or sound-anchor note before PRE-00S."
  durable_record_rule: "Keep this artifact as source-bound route support, not a title, audience, message, or audio lock."
  bank_record_rule: "Only functions selected by the Founder and confirmed in later review may be promoted."

research_vectors:
  - vector_id: song_hook_structure
    research_question: "What first-contact sound gesture can carry a human decision without copying a current release?"
    sample_rule: "Use official/public release context and the local pulse only for function; leave melody, lyrics, BPM, and arrangement to PRE-00S or selected-audio analysis."
    extraction_fields: [opening gesture, contrast point, rejected inference]
    downstream_roles: [song_direction_design, candidate_audio_evaluation_question]
    reject_if_missing: "Reject a route whose hook cannot change the situation on screen."
  - vector_id: mv_world_storyline
    research_question: "Which ordinary public space lets a small decision become cinematic without needing lore?"
    sample_rule: "Use narrative sources for conflict grammar only, then state the original screen consequence and anti-copy boundary."
    extraction_fields: [shared task, visible threshold, object consequence]
    downstream_roles: [front_planning_audience_message_candidate, front_planning_visual_world_candidate, front_planning_reference_connection_candidate]
    reject_if_missing: "Reject a route that relies on atmosphere rather than a visible action or hold."
  - vector_id: wardrobe_material_motion
    research_question: "Which SS26 material can register heat, rain, or acceleration through body movement?"
    sample_rule: "Use the active SS26 record and official LOEWE page; retain only contemporary performance-safe construction."
    extraction_fields: [material response, silhouette, accent color, over-style risk]
    downstream_roles: [front_planning_visual_world_candidate, front_planning_current_title_asset_candidate]
    reject_if_missing: "Reject styling that has no hand, wind, sweat, or silhouette function."
  - vector_id: unit_member_identity_fit
    research_question: "Which active unit turns the proposed contrast into a documented voice and performance hypothesis?"
    sample_rule: "Use member, unit, and voice summaries; do not assign final sections or imitate any reference artist."
    extraction_fields: [opening role, contrast role, release role, unit risk]
    downstream_roles: [song_direction_design, candidate_audio_evaluation_question]
    reject_if_missing: "Reject a unit recommendation that is merely visual branding."

