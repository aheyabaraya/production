    provisional_song_direction: "Test an airy opening tag, close groove verses, a pre-hook that briefly drains the beat, and a warm body-bounce chorus; exact BPM, lyric, melody, and arrangement remain open."
    provisional_audience_hypothesis:
      listener_situation: "A global K-pop fan leaving a crowded day while still carrying the words they did not send."
      desire_or_tension: "They want brightness that admits humidity and hesitation rather than insisting on confidence."
      attraction_trigger: "A small object passes from private worry to a shared, repeatable hand cue."
      likely_rejection: "Soft summer nostalgia with no decision, no group relation, and no audible turn."
      validation_question: "Can the candidate audio create a clear quiet-to-bounce transition without turning the chorus into generic chill pop?"
    recommended_unit:
      unit_code: CACHE_05
      unit_purpose: "Cool groove loop, close-range vocal character, and repeatable mid-tempo hook."
      member_codes: [M01, M02, M03, M04, M09]
