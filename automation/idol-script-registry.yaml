schema_version: idol-script-registry.v1
status: active
script_roots:
  - id: top_level_scripts
    path: scripts
    include_globs: ["*.rb", "*.py", "*.sh", "idol-edit-desk", "idol-video-python"]
    exclude_paths: ["scripts/README.md", "scripts/INDEX.md", "scripts/idol_tiktok_oauth_reauth.py", "scripts/idol_x_oauth_reauth.py", "scripts/idol_youtube_oauth_reauth.py"]
  - id: shared_library_scripts
    path: scripts/lib
    include_globs: ["*.rb", "*.py"]
    exclude_paths: []
documentation_surfaces:
  start_here:
    id: start_here
    path: scripts/README.md
    kind: start_here
    required: true
  index:
    id: full_index
    path: scripts/INDEX.md
    kind: full_index
    required: true
  role_guides:
    - id: state_contracts
      path: scripts/registry/state-and-contracts.md
      kind: role_guide
      required: true
      role: "Graph Engineering state, startup admission, queues, dispatch, and contract routing"
    - id: validators
      path: scripts/registry/validators.md
      kind: role_guide
      required: true
      role: "Schema, semantic, readiness, and release validators"
    - id: research_evidence
      path: scripts/registry/research-and-evidence.md
      kind: role_guide
      required: true
      role: "Audio, reference, source, and measurable evidence routes"
    - id: review_planning
      path: scripts/registry/review-and-planning.md
      kind: role_guide
      required: true
      role: "Front Planning, review boards, contact sheets, and decision projections"
    - id: image_title
      path: scripts/registry/image-and-title.md
      kind: role_guide
      required: true
      role: "02B prompt, image-generation preparation, title assets, and output registry"
    - id: video_playback
      path: scripts/registry/video-and-playback.md
      kind: role_guide
      required: true
      role: "03V prompt authoring, playback intake, and motion handoff"
    - id: edit_qc
      path: scripts/registry/edit-and-qc.md
      kind: role_guide
      required: true
      role: "04 edit source, marker, recipe, FX, QC, and worklists"
    - id: release_platform
      path: scripts/registry/release-and-platform.md
      kind: role_guide
      required: true
      role: "05 package, platform, Drive, workspace, and social evidence"
    - id: runtime_libraries
      path: scripts/registry/runtime-and-libraries.md
      kind: role_guide
      required: true
      role: "Runtime launchers and shared deterministic libraries"
    - id: legacy_one_off
      path: scripts/registry/legacy-and-one-off.md
      kind: role_guide
      required: true
      role: "Historical, inactive, compatibility, and one-off evidence surfaces"
authority_profiles:
  mechanical_default:
    creative_truth: forbidden
    founder_approval: never_inferred
    external_action: closed_by_default
    caveat: "Measures, validates, projects, or transports declared inputs only; never authors creative truth or Founder approval."
  startup_admission_transport_only:
    creative_truth: forbidden
    founder_approval: never_granted
    external_action: forbidden
    caveat: "Verifies the exact run/profile/checkpoint, mechanically validated Role Context Pack receipt, and Current Assignment Delta envelope and compiles transport only; it never launches workers, writes canonical files, or performs paid/external/public action."
  historical_evidence_only:
    creative_truth: forbidden
    founder_approval: never_inferred
    external_action: forbidden
    caveat: "Historical evidence only; no active route, compatibility fallback, canonical promotion, or creative authoring."
  one_off_measurement_only:
    creative_truth: forbidden
    founder_approval: never_inferred
    external_action: forbidden
    caveat: "Named one-off measurement scope only; preserve the result as diagnostic evidence and do not generalize it."
  founder_permission_external_capture:
    creative_truth: forbidden
    founder_approval: required_current_task
    external_action: capture_only_after_permission
    caveat: "Exact public source capture requires current-task Founder permission and canonical source-hub registration."
  founder_approved_read_only_external:
    creative_truth: forbidden
    founder_approval: required_current_task
    external_action: read_only_after_permission
    caveat: "Read-only metric collection requires explicit current-task approval; it never publishes or infers performance."
  founder_approved_credential_write:
    creative_truth: forbidden
    founder_approval: required_current_task
    external_action: credential_write_after_permission
    caveat: "Credential setup/rotation is explicit, value-free, and never prints or exposes secrets."
  founder_approved_external_write:
    creative_truth: forbidden
    founder_approval: required_hash_bound_approval
    external_action: write_after_permission
    caveat: "Upload/post/reply writes require exact hash-bound Founder approval and unresolved-intent safety."
  founder_scoped_cleanup:
    creative_truth: forbidden
    founder_approval: required_scoped_cleanup
    external_action: local_low_risk_only
    caveat: "Dry-run first; production artifacts and canonical bytes remain report-only without a separate cleanup plan."
  founder_decision_transport:
    creative_truth: forbidden
    founder_approval: explicit_input_only
    external_action: local_only
    caveat: "Records/applies explicit Founder decisions but never infers locks, edits creative truth, or widens scope."
  runtime_wrapper:
    creative_truth: forbidden
    founder_approval: never_inferred
    external_action: closed_by_default
    caveat: "Runtime launcher/wrapper only; it does not add authority to the underlying command."
