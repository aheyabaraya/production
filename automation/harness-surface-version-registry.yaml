  - cluster_id: full_mv_stage_owners
    skills: [idol-mv-director, idol-generation, idol-video-prompt]
    disposition: keep_separate
    rationale: Their professional outputs and byte ownership are distinct at 01, post-02A 02B/image review, and 03V; the CDD-reviewed Front Planning development module owns noncanonical pre-02A 02A shards before Overall promotion.
  - cluster_id: face_control_specialists
    skills: [idol-human-face-realism-control, idol-surgical-face-architecture, idol-photoreal-human-face-lock]
    disposition: keep_separate
    rationale: Actual 2026-06 face-study run artifacts reference these paths, so they remain as isolated historical evidence. None is registered in an active skill-load profile or downstream face-reference lane; current-title member identity uses idol-member-visual-identity instead.
  - cluster_id: current_title_member_visual_surfaces
    skills: [idol-member-visual-identity, idol-member-teaser-portrait, idol-track-poster]
