    rationale: Member visual identity owns the clean three-panel appearance authority, teaser portrait owns clean or lightly varied profile portraits, and track poster owns representative hero key art after title appearance is passed.

  - cluster_id: reference_research_owners
    skills: [idol-reference-research-department, idol-world-still-reference-department, idol-pinterest-reference-worker, idol-video-reference-hub]
