schema_version: idol-harness-surface-version-registry.v5
status: active

history_policy:
  current_state_record: path_revision_sha256
  revision_history: git
  same_patch_update: true
  append_only_changelog: false

change_control_policy:
  tracked_surface_change: same_patch_revision_and_sha256_update_required
  contract_authoring_version_change: same_patch_contract_version_registry_update_required
  stale_or_missing_registry_update: hold
  size_finding_authority: diagnostic_or_hold_only
  size_remediation_authority: founder_explicit_current_request_only
  automatic_size_remediation: false

skill_shape_policy:
  target_lines: 500
  reviewed_ceiling_lines: 720
  target_behavior: review_cohesion_and_linked_detail_before_split
  ceiling_behavior: hold_and_request_founder_instruction
  remediation_authority: founder_explicit_current_request_only
  automatic_refactor: false

shared_script_write_guard:
  detection_rule: write_operation_and_canonical_filename_token
  unclassified_behavior: hold
  canonical_filename_tokens:
    - front-planning-readiness
    - 00A-song-lock
    - 01-song-choreography-performance-mv-map
    - 02A-master-storyboard
    - 02B-prompt-packets
    - 03V-video-prompt-manifest
    - 04-edit-map
    - 04FX-finishing-map
    - 05-package
  noncanonical_exemptions:
    - path: scripts/idol_01r_reference_gap_worklist.rb
      reason: Writes only a validated Front Planning v16 adaptive named-gap comparison and exact-five one-second Sequence Unit worklist; it cannot select, apply, combine, reject, or author reference truth.
    - path: scripts/idol_edit_readiness_worklist.rb
      reason: Writes a derived readiness worklist and report only; the referenced 04 edit map remains read-only.
    - path: scripts/idol_export_02b_prompt_manifests.py
      reason: Writes execution exports from validated 02B bytes and never rewrites the canonical packet file.
    - path: scripts/idol_grok_imagine_drive_sync.py
      reason: Inactive historical pre-Branch-Cut mirror helper; it cannot hand off or resume an active run and never writes canonical truth.
    - path: scripts/idol_harness_context_pack.rb
      reason: Writes a derived hash-bound context pack under work and treats 02A or 02B only as read sources.
    - path: scripts/idol_harness_expert_gate.rb
      reason: Writes validation evidence only and never patches the named canonical stage artifacts.
    - path: scripts/idol_low_source_first_rebuild_plan.py
      reason: Writes a LOW/0526-specific noncanonical edit-marker draft; it is not an active general stage author.
    - path: scripts/idol_platform_draft_upload.py
      reason: Writes staged publication records and upload receipts, not the referenced 05 package creative truth.
    - path: scripts/idol_prepare_image_generation_request_v8_legacy.rb
      reason: Legacy-pinned v8 compatibility helper writes only a noncanonical historical request projection and cannot author active v10 work.
    - path: scripts/idol_image_generation_section_worklist_v7_legacy.rb
      reason: Legacy-pinned v7 compatibility helper writes only a noncanonical historical worklist and cannot author active v8 work.
    - path: scripts/idol_prepare_video_prompt_authoring.rb
      reason: Writes an authoring snapshot and request surface; canonical 02B remains a read-only source.
    - path: scripts/idol_video_prompt_section_qa_worklist.rb
      reason: Writes only a manifest-bound derived QA worklist and markdown view under review; it cannot edit 03V prompt truth, QA decisions, or playback status.
    - path: scripts/idol_social_release_sync.py
      reason: Writes staged social delivery files and receipts, not the referenced 05 package.
    - path: scripts/idol_social_release_session.py
      reason: Writes only a derived run-owned session read model and Founder decision packet while treating the referenced 05 package as read-only source truth.
    - path: scripts/validate_edit_recipe.py
      reason: Writes an optional validation report only; the 04 edit map remains read-only.

