selection_policy:
  active_role_binding_cardinality: exactly_one_per_logical_director_role
  provider_native_internal_helpers: default_enabled
  project_numeric_helper_override: none
  internal_helper_additional_authority: forbidden
  physical_session_selection: adaptive_registered_assignment
  internal_and_physical_active_owner_overlap: forbidden
  run_snapshot_pinned: true
  runtime_snapshot_check_required: true
  shadow_eval_required: true
  founder_default_switch_required: true
  silent_model_effort_or_auth_fallback: forbidden
  api_default_enabled: false
  provider_omitted_image_request: current_session_native
  current_session_native_resolution: exact_current_assignment_provider_registered_media_lane
  explicit_api_selection_required: true
  provider_specific_capability_binding: exact_provider_source_and_runtime_inventory
  shared_contract_scope: logical_role_goal_dispatch_successor_review_only
  cross_provider_tool_or_auth_aliasing: forbidden
  unsupported_provider_capability_action: hold_without_cross_provider_fallback
  preferred_nonmedia_provider: grok
  preferred_nonmedia_runtime_surface: grok_cli_acp_or_tui
  preferred_nonmedia_activation: exact_run_resolved_profile_live_inventory_sandbox_and_readiness
  excluded_preferred_generation_lanes: [02b_image_generation, 03v_video_generation]
  fixed_provider_exceptions:
    founder_briefing_assistant: none
  preferred_provider_unavailable_action: hold_without_cross_provider_fallback
  model_literal_allowlist:
    - provider_specific_profile
    - capability_fixture
    - immutable_run_resolved_snapshot
