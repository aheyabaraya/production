research_policy:
  method_basis: "Read AGENTS, production map, automation contract, idol-research-radar skill, schema, member/voice rails, active monthly and SS26 fashion records, then add current public web research dated through 2026-05-27."
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families:
    - song
    - media_narrative
    - fashion
    - idol
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Keep the brief compact while giving each route enough separate song, media, fashion, and idol function to move directly into a 00 draft."
  combination_rule: "Each route must combine at least one current song-function input, one media/message input, one styling input, and one active IDOL ownership input."
  unity_rule: "A route is valid only when tone, mood, and message feel coherent across all four families."
  ref_id_integrity_rule: "Reference IDs remain family-scoped; source_ref_ids and lane_ref_ids only cite refs actually used by that route."
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: "automation/pre-00-research-radar.md#freshness-windows"
  recheck_before_00:
    - "Recheck release or promotion-sensitive song/idol references if founder selection happens after 2026-06-10."
    - "Recheck fashion press when a selected route depends on a very specific SS26 runway/editorial shift."
    - "Recheck current media-trailer signals if the founder delays 00 by more than 14 days."
  durable_record_rule: "Promote only founder-selected or repeatedly useful references into durable records."
  bank_record_rule: "Avoid repeating existing message-hook semantics from creative-bank/message-hooks unless the message/body mechanic changes materially."
