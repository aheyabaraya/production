  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families:
    - song
    - media_narrative
    - fashion
    - idol
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: "Use compact, current references with at least one song, one media narrative, one fashion, and one idol ownership anchor per route."
  combination_rule: "Each route must turn separate song, media, fashion, and idol functions into one new IDOL thesis rather than copying any single source bundle."
  unity_rule: "Tone, mood, and message must agree across the selected four-family set before a route is valid."
  ref_id_integrity_rule: "Every route cites keyed references directly; lane lists must remain family-correct and no route may fake coverage by repeating one ref as multiple families."
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
research_freshness:
  policy_ref: automation/pre-00-research-radar.md
  recheck_before_00:
    - "Recheck public release or promotion-driven refs if founder selection happens after 2026-06-11."
    - "Refresh monthly trend record when the calendar month changes."
    - "Refresh fashion-season signal if a route depends on a new runway/editorial shift beyond the active 2026 SS record."
  durable_record_rule: "Only founder-selected or repeatedly useful radar findings should move into durable source material or reference-library."
  bank_record_rule: "Message-hook ideas should avoid semantic duplicates against creative-bank/message-hooks unless the function changes materially."
