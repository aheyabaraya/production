schema_version: idol-graph-stage-registry.v1
status: shadow_read_only
default_writer: forbidden
legacy_capsule: parse_only
authority: read_only_projection
creative_truth_policy: graph_scripts_never_author

studio_execution:
  graph_node_schema: schemas/graph-node.schema.json
  graph_edge_schema: schemas/graph-edge.schema.json
  graph_event_schema: schemas/graph-event.schema.json
  graph_run_projection_schema: schemas/graph-run-projection.schema.json
  projector: scripts/idol_graph_projector.rb
  startup_owner: overall_director
  canonical_promotion_owner: overall_director
  founder_conversation_owner: overall_director
  director_logical_tier: frontier_director
  worker_logical_tier: worker_high
  research_logical_tier: research_medium
  fallback_policy: forbidden
  active_director_binding_rule: exactly_one_logical_overall_and_one_active_writer_per_lane_stage
  physical_session_ceiling: primary_plus_successor_maximum_two_per_lane_stage
  cross_cohort_cdd_parallelism: disjoint_p3_ci_or_v_ci_lanes_within_lower_capacity_and_backpressure
  successor_before_cas: read_only_not_active_writer
  ordinary_terra_route: forbidden

migration_policy:
  active_default_switch: forbidden
  historical_artifact_use: evidence_only
  harness_ids: parse_only_legacy_capsule
  fallback_to_historical_contracts: forbidden
  retired_active_stage_labels: ["00", "01A", "02"]
  dual_active_writer: fail_closed

decision_ownership_policy:
  one_owner_per_truth: true
  one_active_writer_per_lane_stage: true
  planning_integration_writer: planning_cdd_p1
  section_output_writer: section_image_motion_worker
  cohort_reviewer: one_cdd_per_disjoint_contiguous_cohort
  whole_film_promotion: overall_director
  local_revision_default: revise_smallest_owner_then_invalidate_affected_dependents_only

validation_authority_policy:
  deterministic_authority:
    - schema_types_enums_and_required_fields
    - ids_order_exact_coverage_and_declared_scope
    - paths_sha256_and_source_value_hashes
    - owner_writer_review_promotion_evidence
    - affected_only_invalidation
    - founder_gate_and_cohort_partition
    - judgment_profile_identity_score_range_and_decision_edge
  director_authority:
    - target_message_and_audience_empathy
    - song_section_and_whole_film_progression
    - reference_interpretation_and_section_application
    - story_action_staging_still_camera_and_composition
    - render_prompt_motion_camera_edit_and_creative_quality
    - criterion_grade_and_prose_evidence_authorship
  forbidden_machine_claims:
    - schema_validity_equals_creative_pass
    - script_authored_creative_truth
    - similarity_score_equals_quality
    - receipt_presence_equals_founder_approval
    - graph_projection_equals_canonical_write
    - aggregate_grade_equals_creative_quality

views:
  - view_id: creative_truth
    path: Target -> Audience Promise -> Song -> Full Storyline -> Section -> Major -> Sequence Unit -> Core -> Branch -> Production Cut
  - view_id: evidence_provenance
    path: Source -> Locator -> Selected Surface -> Derivative -> Role Binding -> Attachment Group -> Prompt Packet -> Generated Bytes -> Review
  - view_id: authority_ownership
    path: Founder Envelope -> Overall -> CDD Lane -> Worker Package -> Artifact Scope
  - view_id: execution_session
    path: Dispatch -> Goal -> Provider Session -> Attempt -> Output Manifest -> Return -> Review -> CAS -> Successor/Retired
  - view_id: review_decision
    path: Evidence + Actual Media -> Bound 0-4 Prose Vector -> Local Review -> Pairwise Review -> Global Review -> Gate/Escalation
  - view_id: provider_capability
    path: Logical Tier -> Exact Provider Profile -> Model/Effort -> Tool/Auth Capability -> Runtime Receipt -> Assignment

node_classes:
  - founder_gate
  - authority_envelope
  - decision_epoch
  - overall_lane
  - planning_cdd_lane
  - planning_section_cohort_lane
  - section_cluster_cdd_lane
  - edit_director_lane
  - worker_package
  - stage_checkpoint
  - section_cohort
  - section
  - major
  - sequence_unit
  - core
  - branch
  - production_cut
  - source
  - locator
  - derivative
  - reference_binding
  - attachment_group
  - prompt_packet
  - generated_image
  - motion_storyboard
  - video_output
  - edit_output
  - dispatch
  - goal
  - provider_session
  - attempt
  - return
  - review
  - contextual_judgment
  - hold
  - artifact_pointer
  - context_pack
  - output_manifest
  - runtime_receipt

edge_families:
  authority: [owns, dispatches, returns_to, reviews, promotes, authorized_by, constrained_by, may_read, outside_authority]
  lineage: [derives_from, exact_carries, successor_of, replaces, invalidates, preserves]
  creative: [supports, contrasts, transforms, causes, transitions_to, embodies, complicates, resolves, judged_by]
  production: [binds_reference, attaches, generates, animates, edits]
  coordination: [requires, blocks, joins, boundary_with, conflicts_with, selects_next]
  provider: [resolved_to, executed_by, evidenced_by]

founder_gates:
  - gate_id: G0
    name: Direction lock
    founder_judges: target_audience_promise_message_story_direction_source_provider_spend_envelope
    must_already_be_closed: candidate_research_method_and_director_session_topology
    maps_legacy_stage_id: creative_route_discovery
  - gate_id: G1
    name: Planning route
    founder_judges: one_complete_planning_route_section_progression_material_visual_regime
    must_already_be_closed: raw_references_rejected_routes_cdd_lane_conflict_operational_readiness
    maps_legacy_stage_id: front_planning_integration
  - gate_id: G2
    name: Draft keyframe and 02B envelope
    founder_judges: draft_keyframes_audio_animatic_final_02b_03v_execution_envelope
    must_already_be_closed: render_local_correction_role_coverage_reference_eligibility_motion_readiness
    maps_legacy_stage_id: storyboard_review
    internal_checkpoint: 02a_draft_keyframe
    new_canonical_stage: false
  - gate_id: G3
    name: Reviewed section playback
    founder_judges: reviewed_section_cohort_playback_and_material_exception
    must_already_be_closed: individual_reference_loop_every_i2v_clip_cdd_rollover_smallest_owner_retries
    maps_legacy_stage_id: video_playback_review
  - gate_id: G4
    name: Final master and release
    founder_judges: final_master_protected_output_disposition_release
    must_already_be_closed: shard_merge_mechanics_nonsemantic_qc_manifest_refresh
    maps_legacy_stage_id: master_package_release

existing_founder_gates_preserved:
  - paid_generation_approval
  - public_release_approval
  - download_capture_upload_external_mutation

cohort_policy:
  source: section_roster_only
  capacity_creates_cohort: false
  singleton_allowed: one_section_title_only
  contiguous: true
  sizes: [2, 3]
  partition_rule: remainder_two_at_front_then_threes
  examples:
    - {section_count: 1, partition: [1]}
    - {section_count: 4, partition: [2, 2]}
    - {section_count: 5, partition: [2, 3]}
    - {section_count: 7, partition: [2, 2, 3]}
    - {section_count: 8, partition: [2, 3, 3]}
    - {section_count: 9, partition: [3, 3, 3]}
  p3_activation: after_selected_audio_and_provisional_section_boundaries
  v_activation: after_g40_handoff
  carry_rule: exact_p3_cohort_id_to_v_cohort
  every_section_maps_once: true
  write_scopes_disjoint: true
  boundary_handles: read_only_shared
  disjoint_lane_parallelism: allowed_within_lower_provider_combined_capacity_and_backpressure

director_lanes:
  - lane_id: overall
    node_class: overall_lane
    logical_count: 1
    physical_ceiling: 2
    logical_tier: frontier_director
  - lane_id: planning_p1
    node_class: planning_cdd_lane
    role: planning_cdd_p1
    integration_writer: true
    active_until: g40_handoff
    logical_tier: frontier_director
  - lane_id: planning_p2
    node_class: planning_cdd_lane
    role: planning_cdd_p2
    integration_writer: false
    active_until: g40_handoff
    logical_tier: frontier_director
  - lane_id: planning_p3_ci
    node_class: planning_section_cohort_lane
    role: planning_cdd_p3
    dynamic: true
    one_per: section_cohort
    active_until: g40_handoff
    logical_tier: frontier_director
  - lane_id: section_cluster_v_ci
    node_class: section_cluster_cdd_lane
    role: section_cluster_cdd
    dynamic: true
    one_per: section_cohort
    carries: planning_p3_ci
    active_from: g40_handoff
    logical_tier: frontier_director
  - lane_id: edit_director
    node_class: edit_director_lane
    role: edit_director
    logical_tier: frontier_director
  - lane_id: section_image_motion_worker
    node_class: worker_package
    role: section_image_motion_worker
    one_per: section
    output_writer: true
    logical_tier: worker_high

legacy_source_pointers:
  - capsule: parse_only
    path: automation/harness-stage-registry.yaml
    legacy_id: idol-harness-stage-registry.v8
    json_pointer: /schema_version
    purpose: historical_stage_spine_identity
  - capsule: parse_only
    path: schemas/harness-stage-registry.schema.json
    legacy_id: harness-stage-registry.schema.json
    json_pointer: /$id
    purpose: historical_stage_schema_identity
  - capsule: parse_only
    path: scripts/idol_harness_stage.rb
    legacy_id: idol_harness_stage
    purpose: historical_read_only_stage_atlas

phases:
  - phase_id: song_evidence
    order: 10
    name: Audience, Trend, And Song Evidence
    stage_ids:
      - creative_route_discovery
      - song_direction_design
      - candidate_track_analysis
      - audio_screen_motion_map
      - song_production_lock
  - phase_id: front_planning
    order: 20
    name: Front Planning
    stage_ids:
      - front_planning_integration
  - phase_id: still_direction
    order: 30
    name: Direction And Still Storyboard
    stage_ids:
      - mv_performance_direction
      - mv_storyboard_direction
      - storyboard_review
  - phase_id: section_realization
    order: 40
    name: Section Image And Motion Realization
    stage_ids:
      - image_prompt_compilation
      - image_generation_release_gate
      - branch_cut_generation
      - generated_branch_cut_review
      - audio_branch_cut_placement
      - video_motion_direction
      - video_playback_review
  - phase_id: edit_and_release
    order: 50
    name: Edit And Master
    stage_ids:
      - edit_assembly_playback_qc
      - edit_finishing_fx
      - master_package_release

