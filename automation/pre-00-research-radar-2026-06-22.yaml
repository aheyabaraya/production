  - REF_MEDIA_NARRATIVE_LAST_ROW
  - REF_FASHION_JACKET_UTILITY
  - REF_IDOL_MOTION_UNIT
  lane_ref_ids:
    song:
    - REF_SONG_JUNE_TECHNO_SHIFT
    - REF_SONG_JUNE_MONTHLY_RECORD
    media_narrative:
    - REF_MEDIA_NARRATIVE_LAST_ROW
    fashion:
    - REF_FASHION_JACKET_UTILITY
    idol:
    - REF_IDOL_MOTION_UNIT
  combined_signal: Hard June club pressure + save-trigger section logic + unreadable
    last-row tension + refined utility outerwear + MOTION body proof.
  tone_mood_message_unity:
    tone_and_manner: Fast, cold, and physically decisive.
    mood: Pressure becoming chosen motion.
