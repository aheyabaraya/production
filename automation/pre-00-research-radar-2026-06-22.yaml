---
schema_version: '1.2'
radar_id: PRE00_RESEARCH_RADAR_2026_06_22
date: '2026-06-22'
mode: automation
status: founder_review
research_policy:
  method_basis: AGENTS.md + wiki/production-system.md + wiki/pre-00-song-system.md
    + automation/pre-00-research-radar.md + skills/idol-research-radar/SKILL.md
  current_research_required: true
  minimum_reference_count: 4
  candidate_route_count: 5
  reference_families:
  - song
  - media_narrative
  - fashion
  - idol
  unit_registry: assets/unit-registry.yaml
  reference_depth_goal: Use the active June monthly hypothesis, current SS26 styling
    rails, fresh public June-facing web signals as of 2026-06-22, and the current
    2026-06-10 founder sound-anchor companion fit as a paired PRE-00S review note.
  combination_rule: Every route must combine at least one song, one media narrative,
    one fashion, and one idol reference into a new IDOL thesis rather than decorating
    one dominant source.
  unity_rule: Tone, mood, and message must read as one route across the four families
    before the founder sees it.
  ref_id_integrity_rule: Use keyed family ids once; do not double-count one source
    as multiple families.
  allowed_output: five_route_candidate_brief_before_00
  handoff_target: 00_creative_nucleus_draft
  public_reference_mining_policy:
    status: founder_approved_bilibili_only
    purpose: Preserve the paired 2026-06-10 founder sound-anchor companion note as
      PRE-00S context while this 2026-06-22 radar refresh uses public web research
      and local records only; no private connectors, uploads, paid generation, or
      session stores.
    allowed_platforms:
    - Bilibili
    yt_dlp_scope: Public Bilibili pages only, no account cookies, no private sessions,
      and only for metadata, timestamps, contact sheets, short analysis cuts, or audio/onset
      facts that become notes.
    account_boundary: No login-bound pages, no browser session stores, and no private
      connectors.
    allowed_outputs:
    - URL and timestamp observation notes
    - contact-sheet evidence
    - audio metrics and section segmentation notes
    - reference-song-fit companion analysis
    forbidden_uses:
    - raw media as durable source material
    - prompt attachment input
    - edit source candidate
    - catalog output
    - public package asset
    - YouTube or any non-Bilibili yt-dlp extraction
    trend_alignment_rule: Use Bilibili-derived observations only as a sound-anchor
      companion to the active June monthly hypothesis and current route gaps.
    raw_cache_rule: Raw Bilibili media remains a temporary observation cache under
      `source-materials/video-sources/bilibili/2026-06-10-founder-pre00-reference/`
      and must not be promoted as a durable asset.
research_freshness:
  policy_ref: automation/pre-00-research-radar.md#Freshness Windows
  recheck_before_00:
  - Recheck current-run public web references if founder selection happens after 2026-07-06.
  - Recheck short-lived idol promotion signals if a chosen route waits more than 2-4
    weeks before 00.
  - Keep `source-materials/monthly-trend-records/2026-06.md` and `source-materials/fashion-trend-records/2026-ss.md`
    as hypotheses; current-run source evidence overrides them when they conflict.
  durable_record_rule: Do not promote ordinary radar findings into durable source
    material without founder selection or repeated reuse.
  bank_record_rule: Avoid semantic overlap with 2026-05-24 message-hook records and
    the 2026-06-10 radar unless the message function and body mechanic materially
    change.
